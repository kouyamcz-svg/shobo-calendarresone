<style>
:root{
  --bg:#0B1210; --panel:#131E1A; --panel2:#1A2A24; --line:rgba(255,255,255,.12);
  --text:#E7EFEA; --muted:#8FA59B; --acc:#FFD66B; --accInk:#1A1405;
  --up:#6FD08C; --dn:#F2736B; --dirt:#9A6B45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
 padding-bottom:calc(120px + env(safe-area-inset-bottom));}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;font-size:15px;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);background:var(--panel2);
 border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--panel)}
.btn.primary{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.ghost{background:none;color:var(--muted)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:10px 14px}
.hd .l1{display:flex;align-items:baseline;gap:8px}
.hd .yr{font-size:22px;font-weight:700;color:var(--acc)}
.hd .nm{font-size:16px;font-weight:700}
.hd .l2{font-size:12.5px;color:var(--muted);margin-top:1px}
.teamdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
nav{display:flex;gap:2px;max-width:720px;margin:0 auto;padding:0 8px;overflow-x:auto}
nav button{padding:8px 11px;color:var(--muted);border-bottom:2px solid transparent;font-size:13.5px;font-weight:600;white-space:nowrap}
nav button[aria-current="true"]{color:var(--acc);border-bottom-color:var(--acc)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:12px}
.card h3{font-size:14px;margin-bottom:6px}
.card .cap{font-size:12px;color:var(--muted)}
.yearcard{border-left:3px solid var(--acc)}
.yearcard .hdline{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.yearcard .hdline .y{font-size:17px;font-weight:700}
.yearcard .hdline .a{font-size:12px;color:var(--muted)}
.ev{padding:3px 0;font-size:14px}
.ev.big{color:var(--acc);font-weight:700}
.ev.bad{color:var(--dn)}
.ev.good{color:var(--up)}
.statline{background:var(--panel2);border-radius:9px;padding:9px 11px;margin-top:8px;font-size:14px}
.statline b{font-size:16px}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.kv span{font-size:13px;color:var(--muted)}
.kv span b{color:var(--text);font-weight:700}

/* choice */
.choice{border:1px solid var(--acc);background:#1B2018;border-radius:12px;padding:14px;margin-top:14px}
.choice h3{color:var(--acc);font-size:15px}
.choice p{margin:6px 0 10px;font-size:14px}
.choice .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;
 padding:11px 13px;margin-top:8px;background:var(--panel)}
.choice .opt b{display:block;font-weight:700}
.choice .opt span{font-size:12.5px;color:var(--muted)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.08);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11.5px}
td:first-child,th:first-child{text-align:left}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.now td{color:var(--acc)}
tr.farm td{opacity:.72}
table.cmpct .ex{display:none}
table.lives{table-layout:fixed;width:100%}
.kings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.king{background:var(--panel2);border-radius:10px;padding:9px 10px;cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.king[aria-pressed="true"]{border-color:var(--acc)}
.king .k1{font-size:11.5px;color:var(--muted)}
.king .k2{font-size:17px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.king .k3{font-size:12.5px}
table.lives td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
table.lives td:nth-child(1){width:3.6em}
table.lives td:nth-child(2){width:6.4em}
table{table-layout:auto}
td.num,th{font-variant-numeric:tabular-nums}
table tr>td:first-child,table tr>th:first-child{width:3.4em}
table tr>td:nth-child(2),table tr>th:nth-child(2){max-width:7.5em;overflow:hidden;text-overflow:ellipsis}
tr.tot td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;color:var(--acc);padding-top:8px}

/* abilities */
.abil{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.abil .bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.abil .bar i{display:block;height:100%;background:var(--acc)}
.abil .v{font-weight:700}
.abil .d{font-size:11px;margin-left:6px}
.d.up{color:var(--up)} .d.dn{color:var(--dn)}
svg.radar{display:block;margin:4px auto}

/* footer */
footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(11,18,16,0),var(--bg) 26%);
 padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
footer .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
footer select{flex:0 1 190px}
footer .go{flex:1;background:var(--acc);color:var(--accInk);font-weight:700;border-radius:12px;padding:14px;font-size:16px}
footer .go[disabled]{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--panel2);
 border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.title-badge{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:6px;
 padding:1px 7px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
details{margin-top:4px}
details summary{cursor:pointer;font-size:12.5px;padding:3px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:'＋ '}
details[open] summary:before{content:'− '}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
body.fs-l{font-size:17px}
body.fs-l .ev,body.fs-l .statline,body.fs-l .choice .opt b{font-size:15.5px}
body.fs-l table{font-size:14px}
body.fs-l .cap,body.fs-l .small,body.fs-l .kv span{font-size:13.5px}
body.fs-l .hd .nm{font-size:18px}
body.fs-s{font-size:13.5px}
body.fs-s .ev,body.fs-s .statline{font-size:13px}
body.fs-s table{font-size:11.5px}
body.fs-s .cap,body.fs-s .small,body.fs-s .kv span{font-size:11.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ============ 乱数（状態を保存できる形にして、セーブからの再開でも再現性を保つ） ============ */
let RNG_STATE = Date.now()>>>0;
function rngNext(){
  RNG_STATE = (RNG_STATE + 0x6D2B79F5)|0;
  let t = Math.imul(RNG_STATE ^ RNG_STATE>>>15, 1|RNG_STATE);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
  return ((t ^ t>>>14)>>>0)/4294967296;
}

function mulberry32(a){ setSeed(a); return rngNext; }   // 互換用

function rf(a,b){return a+rnd()*(b-a);}
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function chance(p){return rnd()<p;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function newPlayer(o){
  const p={
    name:o.name||"名無し", kana:"", age:CONFIG.hsStartAge, year:CONFIG.startYear,
    throws:o.throws, bats:o.bats, kind:o.kind, role:o.role||null, pos:o.pos||"投",
    home:o.home, school:o.school, appeal:o.appeal, schoolName:schoolName(o.home||"東京",o.school),
    apt:{}, bat:{}, pit:{}, breaks:[], velo:0, ballistic:2,
    potential:{}, growthType:pick(["超早熟","早熟","早熟","普通","普通","普通","晩成","晩成","超晩成","持続"]),
    durability:ri(45,80), mental:ri(35,75), popularity:5, condition:0, fatigue:0,
    team:null, uniform:null, league:"NPB", status:"高校生", draftRank:null, ikusei:false,
    salary:0, contract:{years:1,left:1}, serviceDays:0, faType:null,
    stage:"hs", hsYear:1, amaType:null, amaYear:0,
    history:[], titles:[], awards:[], injuries:[], career:[], log:[],
    retired:false, closerOK:false, mlbYears:0, everMLB:false, hof:false,
    appeal:o.appeal||null, prevAbil:null, seasonsPro:0, hsBest:"—", amaNote:null
  };
  POSNAMES.forEach(x=>p.apt[x]=0);
  const base = o.school==="強豪私立"? 8 : (o.school==="中堅私立"? 4 : 0);
  // 才能を先に決める。天賦の才がある選手は15歳の時点で既に体も技術も出来上がっている
  const talent = rf(0,1);
  const cap = 56 + Math.pow(talent,2.1)*42;
  const prodigy = Math.max(0,(cap-72))*1.05 + (p.growthType==="超早熟"?7:p.growthType==="早熟"?3:p.growthType==="超晩成"?-4:0);
  p.talentCap = cap;
  const rollA = (lo,hi)=>clamp(Math.round(rf(lo,hi)+base*.6+prodigy+gauss()*4),8,78);
  BATK.forEach(([k])=>p.bat[k]=rollA(22,42));
  PITK.forEach(([k])=>p.pit[k]=rollA(22,42));
  if(p.kind==="二刀流"){
    p.apt["投"]=7;
    const set=POS_APT_SET[p.pos]||POS_APT_SET["右"]; Object.keys(set).forEach(k=>p.apt[k]=set[k]);
    p.velo=Math.round(ri(126,136)+base+prodigy*0.5);
    p.role="先発";
    p.breaks=[{name:pick(["スライダー","カーブ"]),lv:2}];
    p.ballistic=ri(2,4);
  } else if(p.kind==="投手"){
    p.apt["投"]=7; p.pos="投";
    p.velo=Math.round(ri(128,138)+base+prodigy*0.55);
    if(p.role==="先発"){ p.pit.stamina=clamp(p.pit.stamina+18,10,80);
      p.breaks=[{name:pick(["スライダー","カーブ"]),lv:2},{name:pick(["チェンジアップ","フォーク","シュート"]),lv:1}]; }
    else { p.velo+=4; p.pit.nobi=clamp(p.pit.nobi+12,10,80); p.pit.stamina=clamp(p.pit.stamina-10,5,60);
      p.breaks=[{name:pick(["スライダー","フォーク","カットボール"]),lv:2}]; }
    BATK.forEach(([k])=>p.bat[k]=clamp(p.bat[k]-14,5,50));
  }else{
    const set=POS_APT_SET[p.pos]; Object.keys(set).forEach(k=>p.apt[k]=set[k]);
    p.ballistic = p.pos==="一"||p.pos==="三"||p.pos==="左"||p.pos==="右" ? ri(2,4) : ri(1,3);
    if(p.pos==="捕"){p.bat.catching+=14;p.bat.arm+=10;p.bat.fielding+=8;p.bat.speed-=8;}
    if(p.pos==="遊"||p.pos==="二"){p.bat.fielding+=10;p.bat.speed+=8;}
    if(p.pos==="中"){p.bat.speed+=10;p.bat.fielding+=6;}
    if(p.pos==="一"){p.bat.power+=8;p.bat.speed-=10;}
    BATK.forEach(([k])=>p.bat[k]=clamp(p.bat[k],5,64+prodigy));
    p.velo=0;
  }
  // 潜在能力（上限は最初に決めた才能で決まる）
  BATK.forEach(([k])=>p.potential[k]=clamp(Math.round(cap+gauss()*9),p.bat[k]+3,99));
  PITK.forEach(([k])=>p.potential[k]=clamp(Math.round(cap+gauss()*9),p.pit[k]+3,99));
  p.potential.velo = clamp(Math.round(138+ (cap-58)*0.46 + gauss()*3), p.velo+2, 165);
  p.potential.durability = clamp(Math.round(cap+gauss()*12),30,99);
  p.potential.breaks = clamp(Math.round((cap-50)/7.5+gauss()*.9),2,7);
  return p;
}

function breakScore(p){ if(!p.breaks.length)return 0; return Math.min(100,p.breaks.reduce((a,b)=>a+b.lv,0)*7+p.breaks.length*4); }
function batRating(p){

}
function pitRating(p){
  const t=p.pit, v=clamp((p.velo-128)*3.2,0,100);
  return clamp(Math.round(v*.28+t.control*.26+t.stamina*.13+breakScore(p)*.21+t.nobi*.07+t.pinch*.05),0,110);
}
function rating(p){ return p.kind==="投手"?pitRating(p):batRating(p); }
function grade(v){ return v>=88?"S":v>=80?"A":v>=71?"B":v>=62?"C":v>=52?"D":v>=42?"E":v>=30?"F":"G"; }

/* ---- 成長 ---- */
const AGE_OFFSET={"超早熟":4,"早熟":2,"普通":0,"晩成":-2,"超晩成":-4,"持続":-2};
function ageCoef(p){
  // 成長型でピークの時期そのものがずれる
  const a=p.age+(AGE_OFFSET[p.growthType]||0);
  if(a<=18) return 1.35;
  if(a<=21) return 1.15;
  if(a<=24) return .85;
  if(a<CONFIG.peakStart) return .55;
  if(a<=CONFIG.peakEnd) return .18;
  if(a<=33) return -1.05;
  if(a<=36) return -1.30;
  return -2.0;
}
function growthTypeCoef(p){
  const a=p.age;
  switch(p.growthType){
    case "超早熟": return a<=18?2.10:a<=21?1.55:a<=24?0.85:0.40;
    case "早熟":   return a<=21?1.45:a<=26?0.85:0.75;
    case "晩成":   return a<=20?0.60:a<=24?1.05:1.50;
    case "超晩成": return a<=20?0.35:a<=23?0.70:a<=27?1.35:1.95;
    case "持続":   return a<=30?1.00:1.35;
    default:       return 1.00;
  }
}
/* 衰えの速さは成長型で変わる */
function declineCoef(p){
  switch(p.growthType){
    case "超早熟": return 1.50;
    case "早熟":   return 1.18;
    case "晩成":   return 0.90;
    case "超晩成": return 0.78;
    case "持続":   return 0.68;
    default:       return 1.00;
  }
}
function snapshot(p){
  const s={bat:{},pit:{},velo:p.velo,breaks:breakScore(p),rating:rating(p)};
  BATK.forEach(([k])=>s.bat[k]=p.bat[k]); PITK.forEach(([k])=>s.pit[k]=p.pit[k]);
  return s;
}
function growPlayer(p,quality){
  const tr=(typeof TRAININGS!=="undefined"&&TRAININGS[p.training])||null;
  if(tr) quality*=tr.grow;
  p.prevAbil = snapshot(p);
  const pol = appealOf(p);
  const ac=ageCoef(p), gt=growthTypeCoef(p);
  const baseAmt = 4.2*quality*(ac>0? gt : declineCoef(p));
  const apply=(obj,k,potK)=>{
    const w = pol.up[k]!==undefined ? pol.up[k] : .85;
    let d;
    if(ac>0){
      const head = Math.max(0,(p.potential[potK||k]||70)-obj[k]);
      d = baseAmt*ac*w*(0.25+Math.min(1,head/28)) + gauss()*1.1;
    }else{
      // 下降：走力・スタミナ・球速から先に
      const fragile={speed:1.7,baserun:1.3,stamina:1.8,arm:1.25,fielding:1.1,nobi:1.35,quick:1.2,power:1.0,catching:.6,meet:.5,control:.35,eye:.25,bunt:.2,clutch:.3,pinch:.3,vsLeft:.4,hold:.2};
      // 何で勝負してきたかで、衰え方が変わる
      const ap=p.appeal;
      const typeW = (ap==="speed"&&["speed","baserun","fielding"].includes(k)) ? 1.35
                  : (ap==="velo"&&["nobi","stamina"].includes(k)) ? 1.30
                  : (ap==="meet"&&["meet","eye","bunt"].includes(k)) ? 0.62
                  : (ap==="control"&&["control","hold","quick"].includes(k)) ? 0.60
                  : (ap==="break"&&["control","pinch"].includes(k)) ? 0.70
                  : (ap==="defense"&&["fielding","catching","arm"].includes(k)) ? 0.72
                  : 1.0;
      d = baseAmt*ac*(fragile[k]||.8)*typeW*.55 + gauss()*.8;
      if(pol.up[k]) d*=.62;
    }
    obj[k]=clamp(Math.round(obj[k]+d),5,99);
  };
  BATK.forEach(([k])=>apply(p.bat,k));
  PITK.forEach(([k])=>apply(p.pit,k));
  if(p.kind==="投手"){
    const head=Math.max(0,p.potential.velo-p.velo);
    let dv = ac>0 ? (pol.up.velo?1.9:0.9)*quality*gt*ac*(0.3+Math.min(1,head/6)) + gauss()*.7
                  : ac*1.5*(p.appeal==="velo"?1.3:p.appeal==="control"?0.65:1) + gauss()*.5;
    p.velo=clamp(Math.round(p.velo+dv),110,172);
    // 変化球
    const bw = pol.up.breaks?1:0.35;
    if(ac>0 && chance(0.30*bw*quality*2)){
      const cur=p.breaks.find(b=>b.lv<p.potential.breaks);
      if(cur) cur.lv++;
      else if(p.breaks.length<5){
        const cand=BREAKS.filter(n=>!p.breaks.some(b=>b.name===n));
        if(cand.length)p.breaks.push({name:pick(cand),lv:1});
      }
    }
    if(ac<-0.8 && chance(0.12)){ const b=pick(p.breaks); if(b&&b.lv>1)b.lv--; }
  }
  const dcoef = pol.up.durability?1.6:.45;
  if(ac>0)p.durability=clamp(Math.round(p.durability+rf(0,2)*dcoef),5,99);
  else p.durability=clamp(Math.round(p.durability-rf(.4,1.8)),5,99);
  p.mental=clamp(Math.round(p.mental+rf(-1,2.2)),5,99);
  p.condition = clamp(Math.round(gauss()*1.35),-3,3);
}
function diffAbil(p){
  if(!p.prevAbil)return null;
  const d={};
  BATK.forEach(([k])=>d[k]=p.bat[k]-p.prevAbil.bat[k]);
  PITK.forEach(([k])=>d[k]=p.pit[k]-p.prevAbil.pit[k]);
  d.velo=p.velo-p.prevAbil.velo;
  return d;
}

/* ============ リハビリ（手術明けの年をまたぐ処理） ============ */
function rehabStep(p,ev){
  if(!p.rehab||p.rehab<=0) return 0;
  p.rehab--;
  const since = p.rehabFrom? Math.max(1,p.year-p.rehabFrom) : 1;
  if(p.rehab>=1){
    ev.push({t: since<=1? "前年の手術明け。開幕は二軍から、リハビリと調整が続く。"
                        : `${since}年前の手術の影響が残っている。本格的な復帰には至らない。`, c:"bad"});
    return 0.32;
  }
  const r=p.rehabRegain||{};
  if(r.velo)p.velo=clamp(p.velo+r.velo,110,172);
  if(r.stamina)p.pit.stamina=clamp(p.pit.stamina+r.stamina,5,99);
  if(r.speed)p.bat.speed=clamp(p.bat.speed+r.speed,5,99);
  if(r.power)p.bat.power=clamp(p.bat.power+r.power,5,99);
  p.rehabRegain=null; p.rehabFrom=null;
  ev.push({t:`手術から${since}年。失われていた感覚が戻ってきた。`,c:"good"});

}

/* ============ 高校 ============ */
const SCHOOL_LV={"強豪私立":88,"中堅私立":66,"公立":44};
function simHighSchool(p){
  const ev=[]; const lv=SCHOOL_LV[p.school];
  const r=rating(p);
  const need = lv*0.62 + (p.hsYear===1?11:p.hsYear===2?6:0);
  let playing;
  if(r>=need+12) playing="不動のレギュラー";
  else if(r>=need) playing="レギュラー";
  else if(r>=need-10) playing="控え・途中出場";
  else playing="ベンチ外";
  ev.push({t:`${p.schoolName||p.school}（${p.school}）の${p.hsYear}年生。${playing}。`});
  if(p.hsYear===1&&playing.includes("レギュラー")){
    ev.push({t:"1年生ながらレギュラーの座を掴んだ。周囲の見る目が変わった。",c:"big"});
    p.popularity=clamp(p.popularity+10,0,100);
  }

  // チーム成績
  const teamStr = lv + (playing.includes("レギュラー")? (r-need)*0.25 : 0) + gauss()*8;
  let best="地区予選敗退", koshien=0;
  if(teamStr>93) {best="甲子園出場"; koshien=1;}
  else if(teamStr>84) best="県大会決勝進出";
  else if(teamStr>72) best="県大会ベスト4";
  else if(teamStr>58) best="県大会ベスト8";
  if(p.hsYear===3 && teamStr>88 && chance(.5)) {best="甲子園出場"; koshien=1;}
  let kBest="";
  if(koshien){
    const w=clamp(Math.round((teamStr-92)/4+rf(0,2.6)),0,5);
    kBest=["初戦敗退","2回戦進出","ベスト16","ベスト8","ベスト4","全国制覇"][w];
    ev.push({t:`夏の甲子園に出場。${kBest}。`,c:w>=3?"big":"good"});
    p.popularity=clamp(p.popularity+8+w*7,0,100);
  }else{
    ev.push({t:`夏の大会は${best}。`});
    if(best.includes("決勝"))p.popularity=clamp(p.popularity+4,0,100);
  }
  p.hsBest = koshien? "甲子園"+kBest : best;

  // 個人成績
  let stat=null;
  if(playing!=="ベンチ外"){
    const g = playing==="不動のレギュラー"?ri(22,30):playing==="レギュラー"?ri(16,24):ri(6,14);
    let pst=null, bst=null;
    if(p.kind!=="野手"){
      const pg = p.kind==="二刀流"? Math.max(3,Math.round(g*0.6)) : g;
      const era = clamp(3.80-(p.pit.control-38)*.045-(p.velo-130)*.075-breakScore(p)*.020+gauss()*.45,0.00,9);
      const ip=Math.round(pg*rf(4,7));
      pst={type:"p",g:pg,ip,era:+era.toFixed(2),so:Math.round(ip*rf(.7,1.35)),w:Math.round(pg*rf(.25,.55)),l:Math.round(pg*rf(.05,.3))};
      if(p.velo>=147){ ev.push({t:`最速${p.velo}km/hを計測。スカウトの評価が上がった。`,c:"good"}); p.popularity=clamp(p.popularity+6,0,100); }
    }
    if(p.kind!=="投手"){
      const ab=Math.round(g*rf(3,4));
      const avg=clamp(.265+(p.bat.meet-38)*.0040+gauss()*.040,.120,.560);
      const hr=Math.max(0,Math.round(ab*Math.max(0,(p.bat.power-32))/620*(0.6+p.ballistic*.3)+gauss()*.6));
      bst={type:"b",g,ab,h:Math.round(ab*avg),avg:+avg.toFixed(3),hr,sb:Math.round(g*Math.max(0,(p.bat.speed-45))/120)};
      if(hr>=8) p.popularity=clamp(p.popularity+5,0,100);
    }
    stat = (bst&&pst)? Object.assign({},bst,{two:true,pit:pst}) : (pst||bst);
  }

  p.lastPlaying=playing;
  p.playHistory=(p.playHistory||[]).concat([playing]).slice(-3);
  const quality = (playing==="ベンチ外"?.78:1.0)*(lv/70)*1.15;
  growPlayer(p, quality);
  injuryCheck(p, playing==="ベンチ外"?0.25:0.5, ev);
  return {ev,stat,playing};
}

/* ============ 故障 ============ */
function injuryCheck(p, load, ev){
  const tr=(typeof TRAININGS!=="undefined"&&TRAININGS[p.training])||null;
  const base = 0.045 + load*0.06 + Math.max(0,(p.age-28))*0.009 + (60-p.durability)*0.0016 + p.fatigue*0.0009 + (tr?tr.injury:0);
  if(!chance(clamp(base,0.02,0.45))) { p.fatigue=Math.max(0,p.fatigue-18); return null; }
  const heavy = chance(0.22 + Math.max(0,(p.age-30))*0.02);
  if(!heavy){
    const part=pick(["右足首の捻挫","脇腹の肉離れ","腰痛","手首の炎症","太もも裏の肉離れ"]);
    ev.push({t:`${part}で約${ri(3,8)}週間の離脱。`,c:"bad"});
    p.injuries.push({year:p.year,name:part,heavy:false});
    p.fatigue=Math.max(0,p.fatigue-25);
    return {miss:rf(.12,.3),heavy:false};
  }
  const part = p.kind==="投手"? pick(["右肘の靭帯損傷","肩の腱板炎","肘の疲労骨折"]) : pick(["膝の前十字靭帯損傷","アキレス腱断裂","肩関節の脱臼","腰椎の疲労骨折"]);
  ev.push({t:`${part}。手術を受け、長期離脱となった。復帰までには時間がかかる。`,c:"bad"});
  p.injuries.push({year:p.year,name:part,heavy:true});
  const lost={};
  if(p.kind==="投手"){
    lost.velo=ri(2,6); lost.stamina=ri(4,12);
    p.velo=clamp(p.velo-lost.velo,110,172); p.pit.stamina=clamp(p.pit.stamina-lost.stamina,5,99);
  }else{
    lost.speed=ri(4,12); lost.power=ri(0,6);
    p.bat.speed=clamp(p.bat.speed-lost.speed,5,99); p.bat.power=clamp(p.bat.power-lost.power,5,99);
  }
  // 失った分の半分は、2年かけて戻る
  p.rehab=2; p.rehabFrom=p.year;
  p.rehabRegain={}; Object.keys(lost).forEach(k=>p.rehabRegain[k]=Math.round(lost[k]*0.5));
  p.durability=clamp(p.durability-ri(5,14),5,99);
  p.fatigue=0;
  return {miss:rf(.45,.95),heavy:true};
}
/* ============ ドラフト ============ */
const PLAY_FACTOR={"不動のレギュラー":1.06,"レギュラー":1.00,"主力":1.04,"控え・途中出場":0.70,"控え":0.70,"ベンチ外":0.42};
/* リーグの勢力図は毎年動く */
function teamPower(p,id){
  if(!p||!p.leagueState) return (teamById(id)||{power:72}).power;
  const v=p.leagueState[id];
  return v===undefined? (teamById(id)||{power:72}).power : v;
}
function driftLeague(p){
  if(!p.leagueState){ p.leagueState={}; TEAMS.forEach(t=>p.leagueState[t.id]=t.power); }
  TEAMS.forEach(t=>{
    const base=t.power, cur=p.leagueState[t.id];
    let d=(base-cur)*0.12 + gauss()*3.2;           // 平均への回帰＋揺らぎ
    if(chance(0.06)) d += (chance(.5)? rf(4,9) : -rf(4,9));   // 大型補強や主力流出
    p.leagueState[t.id]=clamp(Math.round((cur+d)*10)/10,48,98);
  });
}
function draftEval(p){
  const posNeed = p.kind==="投手"? rf(.9,1.15) : (p.pos==="捕"||p.pos==="遊"? rf(1.0,1.2):rf(.85,1.1));
  // 直近の出場状況＝スカウトが実際に見た姿。試合に出ていない選手は評価されない
  const hist=(p.playHistory||[p.lastPlaying||"控え"]);
  let pf=PLAY_FACTOR[hist[hist.length-1]]||0.7;
  const prev=hist[hist.length-2];
  if(prev) pf=pf*0.78+(PLAY_FACTOR[prev]||0.7)*0.22;
  const v = rating(p)*0.80*pf + p.popularity*0.38*Math.min(1,pf+0.15) + (p.age<=18?4:0) + gauss()*4.2;
  return v*posNeed;
}
function runDraft(p, ev){
  const e=draftEval(p);
  let rank=null, ikusei=false;
  const hs = p.stage==="hs";   // 高校生は育成枠での指名が多い
  if(e>=73) rank=1; else if(e>=65) rank=2; else if(e>=58) rank=3;
  else if(e>=49){ rank=ri(4,5); if(hs) ikusei=chance(.28); }
  else if(e>=39){ rank=6; ikusei=chance(hs?.80:.40); }
  else if(e>=31){ rank=ri(2,7); ikusei=true; }
  else rank=null;
  if(!rank){ ev.push({t:"ドラフト会議。指名されなかった。",c:"bad"}); return null; }
  // 指名球団：そのポジションが手薄な球団が指名しやすい
  const pool=TEAMS.slice().sort(()=>rnd()-.5);
  const local=REGION_TEAMS[p.home]||[];
  const weight=t=>(100-teamPower(p,t.id))*0.5 + t.dev*0.4 + rnd()*40 + (ikusei? t.dev*0.3:0)
    + (local.includes(t.id)? 18:0);   // 地元枠
  const team=pool.sort((a,b)=>weight(b)-weight(a))[0];
  if(rank===1 && !ikusei){
    const rivals=ri(0,3);
    if(rivals>0){
      ev.push({t:`ドラフト1位で${rivals+1}球団が競合。抽選の結果——`,c:"big"});
      if(!chance(1/(rivals+1))){
        const other=pool[1];
        ev.push({t:`${team.name}が交渉権を獲得できず、外れ1位で${other.name}が指名。`});
        return {team:other,rank:1,ikusei:false};
      }
    }
  }
  return {team,rank,ikusei};
}
/* ---- ドラフト同期（比べられ続ける相手） ---- */
function makePeer(p,team,rank){
  const other=pick(TEAMS.filter(t=>t.id!==team.id));

    ab:Math.round(clamp(rf(48,74)+(rank<=2?6:0),30,88)),

}
function peerYear(p,ev){
  const pe=p.peer; if(!pe||pe.retired)return;

      : diff<-8? `同期の${pe.name}は伸び悩んでいるらしい。`

}
function joinTeam(p,team,rank,ikusei){
  p.team=team.id; p.ikusei=ikusei; p.draftRank=rank;

/* ============ 所属チームのライバル ============ */
function genRival(p,kind){
  const t=teamById(p.team)||TEAMS[0];
  let base = kind==="rookie"? rf(36,62) : kind==="fa"? rf(66,86) : rf(48,76);
  base += (teamPower(p,t.id)-72)*0.28;
  return {name:jname(), age: kind==="rookie"? ri(18,22) : ri(23,32),
          ab:Math.round(clamp(base,25,94)),
          role: p.kind==="投手" ? (p.role==="先発"?"先発":"中継ぎ") : p.pos};
}
function wantRivals(p){ return p.kind==="投手" ? (p.role==="先発"?4:5) : 2; }
function ensureRivals(p){
  if(!p.rivals) p.rivals=[];
  while(p.rivals.length<wantRivals(p)) p.rivals.push(genRival(p));
  if(p.kind==="二刀流"){
    if(!p.rivalsP) p.rivalsP=[];
    while(p.rivalsP.length<4) p.rivalsP.push(Object.assign(genRival(p),{role:"先発"}));
  }
}
function ageRivals(p,ev){
  const t=teamById(p.team)||TEAMS[0];
  const say=(txt)=>{ if(ev&&chance(.85)) ev.push({t:txt}); };
  p.rivals.forEach(r=>{
    r.age++;
    r.ab = clamp(Math.round(r.ab + (r.age<=26? rf(1,4.5) : r.age<=30? rf(-1.5,2) : r.age<=33? rf(-5,0) : rf(-9,-2))),20,96);
  });
  p.rivals = p.rivals.filter(r=>{
    if(r.age>=34 && chance(.55)){ say(`${r.name}が現役を引退した。`); return false; }
    if(r.ab<42 && chance(.5)){ say(`${r.name}が戦力外となった。`); return false; }
    if(chance(.07)){ const to=pick(TEAMS.filter(x=>x.id!==p.team));
      say(`${r.name}が${to.name}へ移籍した。${p.pos||p.role}の枠が一つ空く。`); return false; }
    return true;
  });
  if(chance(t.dev/220)){ const nr=genRival(p,"rookie"); p.rivals.push(nr);
    say(`ドラフトで${nr.name}が入団。同じ${p.kind==="投手"?p.role:p.pos}を守る。`); }
  if(chance(t.money/1100)){ const nr=genRival(p,"fa"); p.rivals.push(nr);
    say(`${nr.name}をFAで獲得。強力な競争相手が加わった。`); }
  if(p.rivalsP){ p.rivalsP.forEach(r=>{ r.age++; r.ab=clamp(Math.round(r.ab+(r.age<=26?rf(1,4):r.age<=30?rf(-1,2):rf(-6,0))),20,96); });
    p.rivalsP=p.rivalsP.filter(r=>!(r.age>=34&&chance(.5))); while(p.rivalsP.length<4) p.rivalsP.push(Object.assign(genRival(p),{role:"先発"})); }
  p.rivals.sort((a,b)=>b.ab-a.ab);
  const cap=wantRivals(p)+1;
  if(p.rivals.length>cap) p.rivals=p.rivals.slice(0,cap);
  ensureRivals(p);
}
function rivalTop(p){ return p.rivals.length? Math.max(...p.rivals.map(r=>r.ab)) : 60; }
function rivalSecond(p){ const a=p.rivals.map(r=>r.ab).sort((x,y)=>y-x); return a[1]!==undefined?a[1]:45; }

/* ============ 起用区分 ============ */
function decideUsage(p,as){
  const t=teamById(p.team);
  const isP = as? as==="p" : p.kind==="投手";
  let ab = isP? pitRating(p) : batRating(p);
  if(p.ikusei) return "育成";
  // 若手重視の球団は年齢で補正
  const mg=p.manager||{style:"バランス",trust:50};
  const trustBonus=((mg.trust||50)-50)*0.10;   // 信頼を得ていれば多少の不振でも使われる
  const styleW = mg.style==="若手重視"? 1.9 : mg.style==="実績重視"? 0.3 : 1.0;
  let youthBonus = p.age<=24 ? (t.dev-60)*0.06*styleW : (p.age>=32 ? -(t.dev-60)*0.05*styleW : 0);
  if(mg.style==="実績重視") youthBonus += Math.min(8, p.titles.length*2.5 + Math.min(4,p.seasonsPro*0.4));
  const exp = Math.min(6, p.seasonsPro)*0.9;
  // 慣れないポジションに就いている間は評価が下がる
  const fit = p.kind==="投手"? 0 : (7-(p.apt[p.pos]||0))*2.2;
  const farmPush = p.farmBoost||0;   // 前年に二軍で圧倒した選手は無視されない
  const v = ab + youthBonus + exp + trustBonus + farmPush + (p.condition*1.2) - Math.max(0,(p.age-30))*2.4 - fit;
  const pool = (p.kind==="二刀流"&&isP)? (p.rivalsP||[]) : (p.rivals||[]);
  const abs=pool.map(r=>r.ab).sort((a,b)=>b-a);
  const r1=abs.length?abs[0]:60, r2=abs[1]!==undefined?abs[1]:45;
  if(isP){
    if(p.role==="抑え") return v>=r2-6? "抑え":"中継ぎ";
    if(p.role==="先発"){
      if(v>=r1+4) return "ローテ上位";
      if(v>=r2) return "ローテ下位";
      if(v>=r2-9) return "谷間の先発";
      return "二軍";
    }
    if(v>=r1+2) return "勝ちパターン";
    if(v>=r2-3) return "中継ぎ";
    if(v>=r2-12) return "ビハインド";
    return "二軍";
  }
  if(v>=r1+3) return "不動のレギュラー";
  if(v>=r1-3) return "レギュラー";
  if(v>=r2-2) return "準レギュラー";
  if(v>=r2-12) return "控え";
  // レギュラー争いには勝てなくても、一芸があればベンチに残れる
  if(v>=r2-26){
    const b=p.bat, cands=[];
    if(b.power>=70||b.meet>=68||b.clutch>=72) cands.push(["代打の切り札",Math.max(b.power,b.meet,b.clutch)]);
    if(b.speed>=74&&b.baserun>=66) cands.push(["代走・守備要員",(b.speed+b.baserun)/2+4]);
    if(b.fielding>=72&&b.catching>=68) cands.push(["守備固め",(b.fielding+b.catching)/2+4]);
    if(cands.length) return cands.sort((x,y)=>y[1]-x[1])[0][0];   // 最も突出した一芸で残る
  }
  return "二軍";
}
const USAGE_DAYS={"途中昇格":62,"代打の切り札":112,"代走・守備要員":106,"守備固め":106,"不動のレギュラー":145,"レギュラー":145,"準レギュラー":120,"控え":75,"二軍":25,
 "ローテ上位":145,"ローテ下位":145,"谷間の先発":90,"勝ちパターン":145,"中継ぎ":135,"ビハインド":100,"抑え":145,"育成":0};

/* ============ 成績生成 ============ */
const ORDER_PA={1:4.62,2:4.50,3:4.40,4:4.32,5:4.22,6:4.10,7:4.00};

function simSeasonStats(p,usage,missRatio,opts){

    else ip = apps*(usage==="抑え"?1.0:1.05);

    let era = 5.30 - (p.pit.control-50)*0.0195 - (p.velo-140)*0.021 - breakScore(p)*0.0125
              - (p.pit.nobi-50)*0.009 - (p.pit.pinch-50)*0.006 + eraAdj;
    era = era*(mlb?1:(2-parkAVG*0.55-parkHR*0.45)) ;

    era = clamp(era,0.60,9.99);
    const k9 = clamp(5.6+(p.velo-140)*0.135+breakScore(p)*0.026+(p.pit.nobi-50)*0.022+gauss()*.6,3,14.5);
    const bb9 = clamp(5.6-(p.pit.control-40)*0.052+gauss()*.45,0.8,8);
    const teamQ=(teamPower(p,t.id)-72)*0.012;
    let w=0,l=0,sv=0,hld=0;
    if(starts>0){
      const ace = opts.aceRank===1? 0.035 : opts.aceRank===2? 0.015 : 0;  // エースには good な相手と援護が付く
      const wr=clamp(0.52-(era-3.4)*0.085+teamQ+ace,0.12,0.86);
      const dec=Math.round(starts*rf(.62,.82));
      w=Math.round(dec*wr); l=dec-w;
    }else if(usage==="抑え"){
      sv=Math.round(clamp((t.power-55)*0.8+rf(8,22)-(era-2.5)*6,0,50));
      w=ri(1,5);l=ri(1,5);hld=ri(0,3);
    }else{
      hld=Math.round(clamp(apps*rf(.25,.55)-(era-3)*3,0,48));
      if(usage==="ビハインド")hld=Math.round(hld*.35);
      w=ri(0,6);l=ri(0,6);sv=chance(.25)?ri(0,4):0;
    }
    const bbT=Math.round(ip*bb9/9);
    const ha=Math.round(ip*clamp(8.6+(era-3.5)*0.95,4.5,13.5)/9);
    const er=Math.round(era*ip/9);
    let cg=0,sho=0,qs=0;
    if(starts>0){
      cg=Math.min(starts,Math.max(0,Math.round(clamp((p.pit.stamina-72)/9+(3.6-era)*1.1,0,9)*rf(.4,1.2))));
      sho=Math.max(0,Math.round(cg*rf(0,.45)));
      qs=Math.round(starts*clamp(0.62-(era-3.30)*0.13+(p.pit.stamina-60)*0.003,0.08,0.90));
    }
    return {type:"p",g:apps,gs:starts,ip,w,l,sv,hld,era:+era.toFixed(2),
      so:Math.round(ip*k9/9),bb:bbT,ha,er,cg,sho,qs,
      qsRate: starts? +(qs/starts).toFixed(3) : null,
      whip:+((ip? (bbT+ha)/ip : 0)).toFixed(2)};
  }
  // 野手
  let g;
  if(usage==="不動のレギュラー")g=ri(Math.round(G*.88),G);
  else if(usage==="レギュラー")g=ri(Math.round(G*.72),Math.round(G*.92));
  else if(usage==="準レギュラー")g=ri(Math.round(G*.45),Math.round(G*.72));
  else if(usage==="控え")g=ri(Math.round(G*.2),Math.round(G*.45));
  else if(usage==="代打の切り札")g=ri(Math.round(G*.42),Math.round(G*.72));
  else if(usage==="代走・守備要員")g=ri(Math.round(G*.48),Math.round(G*.80));
  else if(usage==="守備固め")g=ri(Math.round(G*.48),Math.round(G*.80));
  else if(usage==="途中昇格")g=ri(Math.round(G*.25),Math.round(G*.45));
  else g=ri(0,Math.round(G*.15));
  g=Math.max(0,Math.round(g*(1-missRatio)));
  let paPer = usage==="不動のレギュラー"?4.4:usage==="レギュラー"?4.2:usage==="準レギュラー"?3.2
    :usage==="代打の切り札"?1.15:usage==="代走・守備要員"?0.55:usage==="守備固め"?0.95:2.0;
  if(order&&(usage==="不動のレギュラー"||usage==="レギュラー")) paPer=ORDER_PA[order]||paPer;
  const pa=Math.round(g*paPer);
  let avg = 0.234 + (p.bat.meet-50)*0.00188 + (p.bat.eye-50)*0.00035 + cond + lvAdj
            - Math.max(0,(p.ballistic-2))*0.004 + (p.bat.clutch-50)*0.0003;
  avg *= parkAVG;
  if(usage==="代打の切り札") avg -= 0.014;          // 代打は難しい
  if(usage==="代走・守備要員") avg -= 0.008;
  avg += gauss()*(pa>380?0.021:0.036);
  avg=clamp(avg,0.100,0.382);
  const bbRate=clamp(0.045+(p.bat.eye-40)*0.0021+gauss()*.012,0.01,0.20);
  const bb=Math.round(pa*bbRate);
  const ab=Math.max(0,pa-bb-Math.round(pa*0.02));
  const h=Math.round(ab*avg);
  let hrRate = Math.max(0,(p.bat.power-42))/1020*(0.55+p.ballistic*0.26)*parkHR*(mlb?0.92:1);
  const hr=Math.max(0,Math.round(ab*hrRate*rf(.75,1.28)));
  const so=Math.round(pa*clamp(0.20-(p.bat.meet-50)*0.0016+(p.bat.power-50)*0.0009,0.06,0.36));
  const d2=Math.round(h*rf(.16,.26)), d3=Math.round(h*rf(0,.045)*(p.bat.speed/70));
  const tb=h+d2+2*d3+3*hr;
  const obp=ab+bb>0? (h+bb)/(ab+bb+Math.round(pa*0.02)) : 0;
  const slg=ab>0? tb/ab : 0;
  // 監督の方針で機動力の使い方が変わる
  const mgSB = mgStyle==="若手重視"? 1.22 : mgStyle==="実績重視"? 0.90 : 1.0;
  const nicheSB = usage==="代走・守備要員"? 2.1 : 1;
  const sbAtt=Math.round(g*Math.max(0,(p.bat.speed-52))/95*(p.bat.baserun/70)*mgSB*nicheSB*(order?ORDER_SB[order]||1:1));
  const sb=Math.max(0,Math.round(sbAtt*rf(.6,.88)));
  // 打点は打順と、前後を打つ打線の力で変わる
  const lineup = mlb? 1 : clamp(1+(teamPower(p,t.id)-72)*0.005,0.86,1.14);
  const rbi=Math.round((hr*1.65+h*rf(.18,.28)+(p.bat.clutch-50)*0.07*g/100)*(order?ORDER_RBI[order]||1:1)*lineup);
  let err=Math.max(0,Math.round(g*Math.max(0,(72-p.bat.catching))/330*rf(.6,1.5)));
  if(usage==="守備固め") err=Math.max(0,Math.round(err*0.5));
  const chances=Math.max(1,Math.round(g*(p.pos==="捕"?6.2:p.pos==="一"?8.4:p.pos==="二"||p.pos==="遊"?4.6:p.pos==="三"?3.0:1.9)));
  const ORDER_RUN={1:1.20,2:1.12,3:1.06,4:0.97,5:0.91,6:0.87,7:0.84};
  const runs=Math.round((((h+bb)*0.30*(order?ORDER_RUN[order]||1:1))+hr*0.62)*lineup*(0.92+p.bat.baserun/600));
  const shRate = order===2?0.11 : order===1?0.05 : order>=6?0.08 : 0.02;
  const sh=Math.max(0,Math.round(g*shRate*(p.bat.bunt/70)*(mgStyle==="若手重視"?1.2:mgStyle==="実績重視"?0.85:1)));
  const gidp=Math.max(0,Math.round(ab*clamp(0.024-(p.bat.speed-50)*0.00024+(p.ballistic-2)*0.002,0.004,0.045)));
  // 複数ポジションを守った年
  const subs=POSNAMES.filter(x=>x!=="投"&&x!==p.pos&&(p.apt[x]||0)>=5);
  let posLog=[{pos:p.pos,g}];
  if(subs.length&&g>=60&&chance(.45)){
    const sub=pick(subs), sg=Math.round(g*rf(.12,.30));
    posLog=[{pos:p.pos,g:g-sg},{pos:sub,g:sg}];
  }
  return {type:"b",g,pa,ab,h,d2,d3,hr,rbi,runs,sh,gidp,sb,bb,so,err,pos:p.pos,posLog,order:order||null,
    fpct:+((chances-err)/chances).toFixed(3),
    avg:+avg.toFixed(3),obp:+obp.toFixed(3),slg:+slg.toFixed(3),ops:+(obp+slg).toFixed(3)};
}

/* 同じリーグで何年も争う相手。キャリアを通して同じ名前が出る */
function leagueRivals(p){
  if(!p.lgRivals||!p.lgRivals.avg){
    p.lgRivals={};
    ["avg","hr","rbi","sb","w","era","so","sv","hld"].forEach(k=>{
      p.lgRivals[k]={name:jname(),age:ri(22,29),level:rf(-0.7,0.9)};
    });
  }
  Object.keys(p.lgRivals).forEach(k=>{
    const r=p.lgRivals[k]; r.age++;
    if(r.age>=35&&chance(.45)) p.lgRivals[k]={name:jname(),age:ri(21,26),level:rf(-0.7,0.9)};
    else r.level=clamp(r.level+(r.age<=28?rf(-0.1,0.25):rf(-0.3,0.05)),-1.6,1.8);
  });
  return p.lgRivals;
}
function leagueLeaders(p){
  const R=p?leagueRivals(p):null;
  const nm=k=>R?R[k].name:jname();
  const lv=k=>R?R[k].level:0;
  return {
    lv, names:{avg:nm("avg"),hr:nm("hr"),rbi:nm("rbi"),sb:nm("sb"),w:nm("w"),era:nm("era"),so:nm("so"),sv:nm("sv"),hld:nm("hld")},
    avg: clamp(0.332+lv("avg")*0.012+gauss()*0.011,0.300,0.390),
    hr: Math.round(clamp(39+lv("hr")*5+gauss()*5,24,62)),
    rbi: Math.round(clamp(107+lv("rbi")*11+gauss()*11,74,155)),
    sb: Math.round(clamp(38+lv("sb")*7+gauss()*7,20,66)),
    w: Math.round(clamp(16+lv("w")*2+gauss()*2,11,26)),
    era: clamp(1.92-lv("era")*0.30+gauss()*0.34,1.00,3.05),
    so: Math.round(clamp(197+lv("so")*25+gauss()*24,135,285)),
    sv: Math.round(clamp(38+lv("sv")*5+gauss()*5,24,60)),
    hld: Math.round(clamp(42+lv("hld")*5+gauss()*5,26,60))
  };
}
function judgeAwards(p,st,usage,ev){
  if(p.league==="MLB"||p.ikusei) return [];
  const L=leagueLeaders(p); const got=[];
  const add=(n)=>{got.push(n);p.titles.push({year:p.year,name:n});ev.push({t:`${n}を獲得。`,c:"big"});};
  // 惜しくも届かなかったタイトルは、誰に獲られたのかが分かるようにする
  const miss=(mine,top,label,key,fmt)=>{
    if(mine>=top) return;
    if(mine < top*0.88) return;
    ev.push({t:`${label}は${L.names[key]}（${fmt(top)}）に僅差で届かなかった。`});
  };
  if(st.type==="b" && st.pa>=443){
    if(st.avg>=L.avg) add("首位打者"); else miss(st.avg,L.avg,"首位打者","avg",v=>fmtAvg(v));
    if(st.hr>=L.hr) add("本塁打王"); else miss(st.hr,L.hr,"本塁打王","hr",v=>v+"本");
    if(st.rbi>=L.rbi) add("打点王"); else miss(st.rbi,L.rbi,"打点王","rbi",v=>v+"打点");
    if(st.sb>=L.sb) add("盗塁王"); else miss(st.sb,L.sb,"盗塁王","sb",v=>v+"盗塁");
  }
  if(st.type==="p"){
    if(st.ip>=143*0.9 && st.era<=L.era) add("最優秀防御率");
    if(st.w>=L.w) add("最多勝"); else miss(st.w,L.w,"最多勝","w",v=>v+"勝");
    if(st.so>=L.so) add("最多奪三振"); else miss(st.so,L.so,"最多奪三振","so",v=>v+"奪三振");
    if(st.sv>=L.sv) add("最多セーブ");
    if(st.hld>=L.hld) add("最優秀中継ぎ");
  }
  // 表彰
  const star = st.type==="b" ? (st.ops>=.820&&st.g>=100) : (st.era<=3.20&&(st.gs>=20||st.g>=45));
  if(star&&chance(.72)){ p.awards.push({year:p.year,name:"ベストナイン"}); ev.push({t:"ベストナインに選出。",c:"good"}); }
  if(st.type==="b" && st.g>=100 && p.bat.fielding>=78 && (st.err||0)<=9 && chance(.5)){ p.awards.push({year:p.year,name:"ゴールデングラブ賞"}); ev.push({t:"ゴールデングラブ賞を受賞。",c:"good"}); }
  if(star&&chance(.55)){ p.awards.push({year:p.year,name:"オールスター出場"}); ev.push({t:"オールスターに選出された。"}); }
  const mvpOK = st.type==="b" ? (st.ops>=.930&&st.hr>=25&&got.length>=1) : (st.era<=2.20&&st.w>=15) || (st.sv>=38);
  if(mvpOK&&chance(.55)){ p.awards.push({year:p.year,name:"リーグMVP"}); ev.push({t:"リーグMVPに選出された。",c:"big"}); p.popularity=clamp(p.popularity+12,0,100); }
  if(p.seasonsPro===1){
    const roy = st.type==="b"? (st.g>=90&&st.avg>=.265) : ((st.gs>=15&&st.era<=3.4)||st.hld>=20||st.sv>=15);
    if(roy&&chance(.7)){ p.awards.push({year:p.year,name:"新人王"}); ev.push({t:"新人王を受賞。",c:"big"}); p.popularity=clamp(p.popularity+10,0,100); }
  }
  if(st.type==="p"&&st.gs>=22&&st.w>=15&&st.era<=2.50&&st.so>=150&&chance(.8)){
    p.awards.push({year:p.year,name:"沢村賞"}); ev.push({t:"沢村賞に選ばれた。",c:"big"});
  }
  return got;
}

function judgeAwardsMLB(p,st,usage,ev){

    if(q.so>=L.so) add("最多奪三振");
    if(q.sv>=L.sv) add("最多セーブ");

  if(b&&b.ops>=.850&&b.g>=120&&chance(.5)){ p.awards.push({year:p.year,name:"シルバースラッガー賞"}); ev.push({t:"シルバースラッガー賞を受賞。",c:"good"}); }
  if(b&&b.g>=120&&p.bat.fielding>=78&&(b.err||0)<=8&&chance(.4)){ p.awards.push({year:p.year,name:"ゴールドグラブ賞（MLB）"}); ev.push({t:"ゴールドグラブ賞を受賞（メジャー）。",c:"good"}); }
  if(q&&q.gs>=20&&q.era<=2.60&&(q.w>=16||q.so>=230)&&chance(.6)){ p.awards.push({year:p.year,name:"サイ・ヤング賞"}); ev.push({t:"サイ・ヤング賞を受賞した。",c:"big"}); p.popularity=clamp(p.popularity+14,0,100); }
  const mvpOK = (b&&b.ops>=.960&&b.hr>=32&&got.length>=1) || (q&&q.era<=2.30&&q.w>=18);

  if(p.mlbYears===1){
    const roy=(b&&b.g>=110&&b.ops>=.780)||(q&&((q.gs>=18&&q.era<=3.60)||q.sv>=20));
    if(roy&&chance(.55)){ p.awards.push({year:p.year,name:"新人王（MLB）"}); ev.push({t:"新人王を受賞した（メジャー）。",c:"big"}); p.popularity=clamp(p.popularity+10,0,100); }
  }
  return got;

/* ============ 年俸 ============ */
// 起用そのものの価値。毎日試合に出ること自体が評価される
const NICHE_USAGE=["代打の切り札","代走・守備要員","守備固め"];
const USAGE_VALUE={"不動のレギュラー":25,"レギュラー":18,"準レギュラー":9,"控え":3,"途中昇格":7,
  "代打の切り札":7,"代走・守備要員":6,"守備固め":6,
  "ローテ上位":12,"ローテ下位":8,"谷間の先発":4,"抑え":12,"勝ちパターン":10,"中継ぎ":5,"ビハインド":2};
function perfScore(p,st,usage){
  const ub=USAGE_VALUE[usage]||0;
  if(st.type==="b"){
    if(st.pa<80) return clamp(10+st.g*0.25+ub*0.4,0,35);
    const v = ub + (st.avg-.260)*260 + (st.ops-.720)*120 + st.hr*0.85 + st.rbi*0.14 + st.sb*0.22 + st.g*0.08;
    return clamp(v,0,200);
  }
  if(st.ip<15) return clamp(8+st.g*0.6+ub*0.4,0,35);
  const v = ub + (4.20-st.era)*16 + st.w*2.8 + st.sv*1.4 + st.hld*1.0 + st.ip*0.10 + st.so*0.05;
  return clamp(v,0,200);
}
function updateSalary(p,st,usage,titles,ev){
  if(p.league==="MLB") return;
  const sc = (typeof p.perfScore==="number")? p.perfScore : ((st&&!st.farm)? perfScore(p,st,usage) : 6);
  const old=p.salary;
  if(p.contract.left>1){
    p.contract.left--;
    p.contractLocked=true;   // 契約期間中。更改も戦力外もない
    ev.push({t:`${p.contract.years}年契約の${p.contract.years-p.contract.left}年目。年俸${yen(p.salary)}は据え置き。残り${p.contract.left}年。`});
    return;
  }
  p.contractLocked=false;
  const t=teamById(p.team)||TEAMS[0];
  const svYears=p.serviceDays/CONFIG.faDaysPerYear;
  // その年の働きに見合う「適正年俸」を出し、現年俸との間で着地させる
  let fair = Math.pow(Math.max(sc,4),1.35)*24;
  // 球界を代表する成績には、相場を超えた値段がつく
  fair *= 1 + Math.max(0,(sc-85))*0.013;
  fair *= 0.68 + Math.min(1, svYears/4)*0.52;                 // 経験・一軍での実績（4年で頭打ち）
  fair *= 0.90 + Math.min(1,(p.lastDays||0)/CONFIG.faDaysPerYear)*0.15;  // 一軍帯同
  fair *= 1 + Math.min(titles.length,4)*0.22;                 // タイトル
  const bigAwards=p.awards.filter(a=>a.year===p.year&&["リーグMVP","沢村賞","新人王"].includes(a.name)).length;
  fair *= 1 + bigAwards*0.12;
  fair *= 1 + p.popularity/500;                               // 人気・観客動員
  if(p.lastChamp) fair*=1.10; else if(p.lastRank===1) fair*=1.05;  // チームへの貢献
  fair *= 0.86 + t.money/520;                                 // 球団の資金力（大きい球団ほど出せる）
  if(p.ikusei) fair*=0.45;
  let next = old*0.35 + fair*0.65;
  // 高額になるほど上げ幅は抑えるが、飛び抜けた年は例外
  let upCap = old<3000? 2.6 : old<8000? 2.1 : 1.85;
  if(sc>=105) upCap += 0.55;
  if(titles.length>=1) upCap += 0.25;
  next = Math.min(next, old*upCap + 800);
  // 一軍で主力として出続けていれば、5000万までは自然に到達する
  const REGULAR_USAGE=["不動のレギュラー","レギュラー","ローテ上位","ローテ下位","抑え","勝ちパターン"];
  if(REGULAR_USAGE.includes(usage)&&!p.ikusei)
    next = Math.max(next, Math.min(5000, 1800 + svYears*1100));
  const cutLim = p.age<=25? CONFIG.cutLimitYoung : CONFIG.cutLimit;
  next = Math.max(next, old*(1-cutLim));                      // 減額制限
  next = Math.min(next, CONFIG.salaryCapNPB);
  next = Math.max(next, p.ikusei?CONFIG.minSalaryIkusei:CONFIG.minSalaryNPB);
  p.nextSalary=Math.round(next/10)*10;
}
function yen(man){
  if(man>=10000){ const oku=Math.floor(man/10000), rest=man%10000;
    return rest? `${oku}億${rest}万円` : `${oku}億円`; }
  return `${man}万円`;
}
function usd(v){
  const yenMan = v*CONFIG.usdJpy/10000;          // 円（万円）換算
  const jp = yenMan>=10000 ? `約${(yenMan/10000).toFixed(1)}億円` : `約${Math.round(yenMan)}万円`;
  const dollars = v>=1000000 ? `$${(v/1000000).toFixed(1)}M` : `$${Math.round(v/1000)}K`;
  return `${dollars}（${jp}）`;
}
/* ============ 順位 ============ */
function simStandings(p,myContribution){
  const out={};
  const mine=myContribution||0;   // その年の自分の働き。優勝争いに実際に効く
  ["日輪","蒼海"].forEach(lg=>{
    const arr=TEAMS.filter(t=>t.lg===lg).map(t=>({id:t.id,name:t.name,
      v:teamPower(p,t.id)+gauss()*7+(t.id===p.team? mine:0)}));
    // 勝ち数は強さから直接決める（順位と勝ち数が食い違わないように）
    const avgV=arr.reduce((a,b)=>a+b.v,0)/arr.length;
    arr.forEach(x=>{ x.wRaw = 71.5 + (x.v-avgV)*0.62; });
    const target=arr.length*CONFIG.gamesNPB/2;                 // リーグ全体の勝ち数の合計
    const sum=arr.reduce((a,b)=>a+b.wRaw,0);
    arr.forEach(x=>{ x.wRaw = x.wRaw*target/sum; });
    arr.sort((a,b)=>b.wRaw-a.wRaw);
    arr.forEach((x,i)=>{ x.rank=i+1; x.w=Math.round(x.wRaw); x.l=CONFIG.gamesNPB-x.w; });
    // 端数で順位と勝ち数が逆転しないよう整える
    for(let i=1;i<arr.length;i++) if(arr[i].w>arr[i-1].w){ arr[i].w=arr[i-1].w; arr[i].l=CONFIG.gamesNPB-arr[i].w; }
    out[lg]=arr;
  });
  const c1=out["日輪"][0], c2=out["蒼海"][0];
  const champ = chance(.5)? c1 : c2;
  return {out,champ};
}

const MANAGER_STYLES=["若手重視","実績重視","バランス"];
function newManager(t){
  const style = t.dev>=82? pick(["若手重視","若手重視","バランス"]) : t.money>=85? pick(["実績重視","実績重視","バランス"]) : pick(MANAGER_STYLES);
  return {name:jname(), style, since:0};
}
function manageStaff(p,ev){
  const t=teamById(p.team);
  if(!p.manager){ p.manager=newManager(t); p.manager.since=p.year; p.manager.trust=50;
    ev.push({t:`${p.manager.name}監督の下でプレーする。方針は${p.manager.style}。`}); return; }

}
function recordEvents(p,st,usage,ev){
  if(!st||st.farm) return;
  if(st.type==="p"){
    const dom = clamp((3.60-st.era)*0.10 + (p.velo-140)*0.006 + breakScore(p)*0.0016,0,0.34);
    if(st.gs>=10){
      if(chance(dom*0.10)){ ev.push({t:"完全試合を達成した。球史に残る一日となった。",c:"big"});
        p.awards.push({year:p.year,name:"完全試合"}); p.popularity=clamp(p.popularity+16,0,100); }
      else if(chance(dom*0.30)){ ev.push({t:"ノーヒットノーランを達成。",c:"big"});
        p.awards.push({year:p.year,name:"ノーヒットノーラン"}); p.popularity=clamp(p.popularity+11,0,100); }
    }
    if(st.so>=200){ ev.push({t:"シーズン200奪三振に到達。",c:"good"}); }
    if(st.gs>=20&&st.era<=2.00){ ev.push({t:"防御率1点台でシーズンを終えた。",c:"good"}); }
  }else{
    if(st.g>=100){
      if(chance(clamp((st.avg-0.250)*0.35+(p.bat.speed-60)*0.0016,0,0.10))){
        ev.push({t:"サイクルヒットを達成した。",c:"big"}); p.awards.push({year:p.year,name:"サイクルヒット"});
        p.popularity=clamp(p.popularity+8,0,100);
      }
      if(st.hr>=30&&chance(0.06)){ ev.push({t:"1試合4本塁打を記録した。",c:"big"});
        p.awards.push({year:p.year,name:"1試合4本塁打"}); p.popularity=clamp(p.popularity+9,0,100); }
    }
    if(st.h>=180){ ev.push({t:"シーズン180安打を超えた。",c:"good"}); }
  }
  // 連続試合出場
  const full = st.type==="b" && st.g>=CONFIG.gamesNPB-5;
  if(full){ p.streak=(p.streak||0)+1; p.streakGames=(p.streakGames||0)+st.g; }
  else { if((p.streakGames||0)>=300) ev.push({t:`連続試合出場が${p.streakGames}でストップした。`}); p.streak=0; p.streakGames=0; }
  if(p.streak===5) ev.push({t:`5年連続で全試合に出場。連続${p.streakGames}試合、鉄人と呼ばれ始めた。`,c:"good"});
  if(p.streak>=10&&p.streak%5===0) ev.push({t:`連続試合出場${p.streakGames}。記録は続いている。`,c:"big"});
  [700,1000,1500,2000].forEach(m=>{ if((p.streakGames||0)>=m && (p.streakGames-st.g)<m){
    p.awards.push({year:p.year,name:`連続${m}試合出場`}); ev.push({t:`連続${m}試合出場を達成した。`,c:"big"}); }});
  p.bestGames=Math.max(p.bestGames||0,p.streakGames||0);
}

        : `${ri(4,7)}試合 打率${fmtAvg(clamp(0.245+(p.bat.meet-50)*0.0035+gauss()*0.09,0,0.7))} ${ri(0,2)}本`;

function battingOrder(p,usage){
  if(p.kind==="投手"||usage==="二軍"||usage==="育成") return null;
  const b=p.bat;
  const style=(p.manager&&p.manager.style)||"バランス";
  // 実績重視の監督はタイトル歴のある選手をクリーンナップに置きたがる
  const bonus = style==="実績重視"? Math.min(10,p.titles.length*4+Math.min(4,p.seasonsPro*0.3)) : 0;
  const pw=b.power+bonus, mt=b.meet+bonus;
  if(pw>=78&&mt>=62) return 4;
  if(mt>=74&&pw>=58) return 3;
  if(b.speed>=78&&mt>=62) return 1;
  if(style==="若手重視"&&p.age<=24&&b.speed>=68&&mt>=60) return 1;
  if(pw>=68) return 5;
  if(mt>=66) return 2;
  if(usage==="不動のレギュラー"||usage==="レギュラー") return pick([6,7]);
  return null;
}
function simProYear(p){

  if(p.kind==="投手"&&p.role!=="先発"){
    if(p.role!=="抑え" && (usage==="勝ちパターン") && (p.lastERA<=2.35 || chance(.16)) && p.velo>=145){
      p.role="抑え"; usage="抑え"; ev.push({t:"守護神に抜擢された。9回のマウンドを任される。",c:"big"});
    }else if(p.role==="抑え" && p.lastERA>=4.00){

  const inj=injuryCheck(p, (usage==="二軍"?0.25:0.85)+(p.intlLast?0.25:0), ev);
  p.intlLast=false;
  const miss=Math.min(0.96,(inj?inj.miss:0)+extraMiss);
  let noFirst = (usage==="二軍"||usage==="育成");   // 一軍の記録は残らない。二軍成績だけが残る

  if(NICHE_USAGE.includes(usage)&&p.lastUsage!==usage){

  }
  p.lastUsage=usage;
  const aceRank = p.kind==="投手"&&p.role==="先発"? (rating(p)>=rivalTop(p)?1:(rating(p)>=rivalSecond(p)?2:3)) : null;

  if(noFirst){

    const fb=farmLine.two? farmLine : farmLine;
    const domB = fb.type==="b" && fb.g>=60 && (fb.avg>=0.315||fb.hr>=15);
    const domP = fb.type==="p" && ((fb.gs>0&&fb.ip>=70&&fb.era<=2.50)||(fb.gs===0&&fb.g>=30&&fb.era<=2.00));
    const dom = domB||domP;
    p.farmBoost = dom? 7 : (fb.type==="b"&&fb.avg>=0.290)||(fb.type==="p"&&fb.era<=3.20)? 3 : 0;
    if(dom&&!p.ikusei&&chance(0.62)){
      // シーズン途中で一軍に呼ばれる

      st=simSeasonStats(p,"控え",Math.min(0.92,miss+0.30),{order:battingOrder(p,"控え")});
      st.calledUp=true; st.farmLine=farmLine;
      ev.push({t:"二軍で結果を出し続け、シーズン途中に一軍へ昇格した。",c:"good"});
    }else{
      st=farmLine;
      if(dom) ev.push({t: p.ikusei
        ? "二軍では圧倒的な成績。支配下登録されない限り、一軍の舞台はない。"
        : "二軍では圧倒的な成績を残したが、一軍から声は掛からなかった。", c:"bad"});
    }
  }
  else p.farmBoost=0;
  if(!st){
  if(p.kind==="二刀流"){

    if(st.type==="p"&&st.era<=2.20&&st.ip>=80&&chance(.6)){ p.awards.push({year:p.year,name:"ファーム最優秀防御率"}); ev.push({t:"二軍で最優秀防御率。あとは一軍で通用するかどうか。",c:"good"}); }
  }
  recordEvents(p,st,usage,ev);
  nationalTeam(p,st,usage,ev);
  const S2=simStandings(p, clamp((sc-45)*0.14,-6,14));
  const myRank=(S2.out[t.lg].find(x=>x.id===t.id)||{}).rank;
  p.lastRank=myRank; p.lastChamp=(S2.champ.id===t.id);

  ev.push({t:`${t.name}はリーグ${myRank}位。${S2.champ.id===t.id?"日本一に輝いた。":""}`,c:S2.champ.id===t.id?"good":""});
  if(S2.champ.id===t.id) p.popularity=clamp(p.popularity+5,0,100);
  // 人気
  const pop = (!st||st.farm)? -4 : st.type==="b"? (st.hr*0.35+(st.avg-.25)*60+st.g*0.04) : (st.w*0.7+st.sv*0.5+st.hld*0.25+(3.6-st.era)*2.5);
  p.popularity=clamp(Math.round(p.popularity+clamp(pop,-6,14)*0.6-1.5),0,100);
  if(p.kind!=="投手"&&(p.apt[p.pos]||0)<7&&chance(0.5)){
    p.apt[p.pos]=(p.apt[p.pos]||0)+1;
    if(p.apt[p.pos]===6) ev.push({t:`${p.pos}の守備が板についてきた。`,c:"good"});

  if(p.manager){
    const sc2=p.perfScore||0;
    const before=p.manager.trust||50;

    if(before>=40&&p.manager.trust<40) ev.push({t:`${p.manager.name}監督の構想から外れかけている。`,c:"bad"});
  }
  if(!p.ikusei&&(p.perfScore||0)>=85&&Number(p.uniform)>9&&chance(.45)){
    const n=String(ri(1,9));
    ev.push({t:`来季から背番号${n}を背負うことになった。`,c:"good"});

  p.ratingLog=(p.ratingLog||[]).concat([{year:p.year,v:rating(p)}]).slice(-30);
  const q = usage==="二軍"?0.75:(usage==="育成"?0.6:1.0);
  growPlayer(p,q);
  updateSalary(p,st,usage,titles,ev);
  return {ev,st,usage,titles,rank:myRank};
}

/* ============ 打撃成績の組み立て（一軍・二軍・独立で共通の計算式を使う） ============ */
function battingLine(p,g,ab,h,hr,bbRate){
  const bb=Math.round(ab*bbRate);
  const pa=ab+bb+Math.round(ab*0.02);
  const d2=Math.round(h*rf(.13,.22)), d3=Math.round(h*rf(0,.04)*(p.bat.speed/70));
  const singles=Math.max(0,h-d2-d3-hr);
  const tb=singles+2*d2+3*d3+4*hr;
  const obp=(h+bb)/Math.max(1,pa);
  const slg=tb/Math.max(1,ab);
  return {g,pa,ab,h,d2,d3,hr,
    rbi:Math.round(hr*1.65+h*0.24),
    sb:Math.round(g*Math.max(0,(p.bat.speed-50))/95),
    bb,so:Math.round(ab*0.19),err:0,
    sh:Math.max(0,Math.round(g*0.035*(p.bat.bunt/70))),
    gidp:Math.max(0,Math.round(ab*clamp(0.024-(p.bat.speed-50)*0.00024,0.004,0.045))),
    runs:Math.round((h+bb)*0.30+hr*0.62),
    avg:+(h/Math.max(1,ab)).toFixed(3),obp:+obp.toFixed(3),slg:+slg.toFixed(3),ops:+(obp+slg).toFixed(3)};
}

/* ============ 二軍（ファーム）の成績 ============ */
function simFarmStats(p,miss){
  if(p.kind==="二刀流"){
    const b=simFarmStats(Object.assign({},p,{kind:"野手"}),miss);
    const q=simFarmStats(Object.assign({},p,{kind:"投手"}),Math.min(0.9,miss+0.25));
    return Object.assign({},b,{two:true,pit:q});
  }
  if(p.kind==="投手"){
    const starter = p.role==="先発";
    const g=Math.max(0,Math.round((starter?ri(12,20):ri(24,38))*(1-miss)));
    const ip=Math.round((starter? g*rf(4.2,5.8) : g*rf(1.0,1.3))*10)/10;
    const era=clamp(4.55-(p.pit.control-45)*0.032-(p.velo-136)*0.050-breakScore(p)*0.014+gauss()*0.55,0.20,9.99);
    return {type:"p",farm:true,g,gs:starter?g:0,ip,w:Math.round(g*rf(.15,.45)),l:Math.round(g*rf(.1,.35)),
      sv:0,hld:0,era:+era.toFixed(2),so:Math.round(ip*rf(.75,1.15)),bb:Math.round(ip*rf(.3,.55))};
  }
  const g=Math.max(0,Math.round(ri(62,106)*(1-miss)));
  const ab=Math.round(g*rf(3.2,3.8));
  const avg=clamp(0.245+(p.bat.meet-45)*0.0035+gauss()*0.034,0.110,0.450);
  const h=Math.round(ab*avg);
  const hr=Math.max(0,Math.round(ab*Math.max(0,(p.bat.power-38))/780*(0.6+p.ballistic*0.28)));
  return Object.assign({type:"b",farm:true},battingLine(p,g,ab,h,hr,0.10));
}

/* ============ 独立リーグのシーズン ============ */
function simIndyYear(p){
  const ev=[{t:`${p.indyTeam||"独立リーグ"}でのシーズン。NPBのスカウトの目を意識しながらプレーする。`}];
  const reh=rehabStep(p,ev);
  const inj=injuryCheck(p,0.7,ev);
  const miss=Math.min(0.96,(inj?inj.miss:0)+reh);
  let st;
  if(p.kind==="投手"){
    const g=Math.max(0,Math.round(ri(16,26)*(1-miss)));
    const ip=Math.round(g*rf(4.0,6.2)*10)/10;
    const era=clamp(4.40-(p.pit.control-42)*0.033-(p.velo-134)*0.052-breakScore(p)*0.014+gauss()*0.50,0.20,9.99);
    st={type:"p",g,gs:p.role==="先発"?g:0,ip,w:Math.round(g*rf(.2,.5)),l:Math.round(g*rf(.1,.35)),sv:0,hld:0,
        era:+era.toFixed(2),so:Math.round(ip*rf(.8,1.2)),bb:Math.round(ip*rf(.25,.5))};
    p.lastERA=st.era;
  }else{
    const g=Math.max(0,Math.round(ri(58,80)*(1-miss)));
    const ab=Math.round(g*rf(3.2,3.9));
    const avg=clamp(0.238+(p.bat.meet-42)*0.0030+gauss()*0.034,0.110,0.450);
    const hr=Math.max(0,Math.round(ab*Math.max(0,(p.bat.power-38))/760*(0.6+p.ballistic*0.28)));
    const h=Math.round(ab*avg);
    st=Object.assign({type:"b"},battingLine(p,g,ab,h,hr,0.10));
  }
  p.seasonsPro++;
  p.lastDays=0; p.lastRank=null; p.lastChamp=false;
  p.perfScore=perfScore(p,st,"独立");
  // 独立リーグでの成績はスカウトの評価に直結する
  const domB = st.type==="b" && st.g>=50 && (st.avg>=0.320||st.hr>=15);
  const goodB= st.type==="b" && st.g>=40 && (st.avg>=0.290||st.hr>=10);
  const domP = st.type==="p" && ((st.gs>0&&st.ip>=70&&st.era<=2.40)||(st.gs===0&&st.g>=25&&st.era<=2.00));
  const goodP= st.type==="p" && st.era<=3.20 && st.ip>=50;
  p.indyBoost = (domB||domP)? 0.25 : (goodB||goodP)? 0.12 : 0;
  if(p.indyBoost>=0.25) ev.push({t:"独立リーグで圧倒的な数字を残した。NPBのスカウトが視察に訪れている。",c:"good"});
  else if(p.indyBoost>0) ev.push({t:"独立リーグでまずまずの成績。スカウトの評価も少しは上がった。"});
  ev.push({t:p.kind==="投手"?`${st.g}登板 ${st.w}勝${st.l}敗 防御率${st.era.toFixed(2)}`:`${st.g}試合 打率${fmtAvg(st.avg)} ${st.hr}本塁打`});
  growPlayer(p,0.85);
  return {ev,st,usage:"独立リーグ",titles:[],rank:null};
}

/* ============ オフの取り組み ============ */
const TRAININGS={
  joint:{label:"合同自主トレに参加する",sub:"一流選手と同じメニュー。伸びるが体への負担も大きい",grow:1.28,injury:0.025,fatigue:0},
  solo:{label:"単独で調整する",sub:"自分のペースで整える。故障が減る",grow:1.0,injury:-0.03,fatigue:-12},
  form:{label:"フォームを改造する",sub:"大きく変わる可能性がある。失敗すれば崩れる",grow:1.62,injury:0.01,fatigue:0,gamble:true},
  rest:{label:"休養を優先する",sub:"疲労を抜き、故障を避ける。伸びは鈍る",grow:0.72,injury:-0.06,fatigue:-35}
};
function trainingDecision(p,allowAppealChange){
  const keys=Object.keys(TRAININGS);
  if(p.training&&keys.includes(p.training)) keys.splice(keys.indexOf(p.training),1), keys.unshift(p.training);
  const opts=keys.map(k=>({label:(k===p.training?"前年と同じ　":"")+TRAININGS[k].label,sub:TRAININGS[k].sub,
    run:()=>{
      p.training=k;
      if(TRAININGS[k].gamble){
        if(chance(0.35)){
          const keys=p.kind==="投手"?["control","nobi","quick"]:["meet","power","fielding"];
          keys.forEach(x=>{ const o=p.kind==="投手"?p.pit:p.bat; o[x]=clamp(o[x]-ri(2,5),5,99); });
          p.pendEv.push({t:"フォーム改造は噛み合わなかった。感覚を失い、数字を落とした。",c:"bad"});
        }else p.pendEv.push({t:"フォーム改造に着手した。手応えはある。",c:"good"});
      }
    }}));
  if(allowAppealChange){
    const list=(APPEALS[p.kind]||[]).filter(a=>a.id!==p.appeal);
    opts.push({label:"取り組む方向を変える",sub:"伸ばす能力そのものを切り替える",
      run:()=>{
        S.decisions.unshift({title:"方向転換",desc:"これから何を伸ばすか。",
          options:list.map(a=>({label:a.label,sub:a.desc,run:()=>{
            p.appeal=a.id; p.training="solo";
            p.pendEv.push({t:`${a.label}を軸に鍛え直すことにした。`,c:""});
          }}))});
      }});
  }
  return {title:"オフの過ごし方",desc:"この冬をどう使うか。",options:opts};
}

/* ============ オフの意思決定 ============ */
function faYears(p){ return p.faType==="hs"?CONFIG.faDomesticHS:CONFIG.faDomesticCollege; }
function faDomesticOK(p){ return p.serviceDays>=faYears(p)*CONFIG.faDaysPerYear; }
function faOverseasOK(p){ return p.serviceDays>=CONFIG.faOverseas*CONFIG.faDaysPerYear; }
function marketValue(p){
  const r=rating(p), sc=p.perfScore||40;
  let v = (r-55)*180 + sc*95 + p.popularity*45;
  if(p.age>=33)v*=0.68; else if(p.age>=31)v*=0.85; else if(p.age<=27)v*=1.12;
  return clamp(Math.round(v/100)*100, 600, 70000);
}
function makeOffers(p,n){
  const cur=p.team;
  const cands=TEAMS.filter(t=>t.id!==cur).sort((a,b)=>(b.money+rnd()*60)-(a.money+rnd()*60)).slice(0,n);
  const mv=marketValue(p);
  return cands.map(t=>{
    const fit=(t.money/100);
    const sal=Math.round(mv*(0.75+fit*0.55)*rf(.9,1.2)/10)*10;
    const yrs=clamp(Math.round(rf(1,5)-(p.age>=33?1.5:0)),1,5);
    const need = rnd()<0.5? "レギュラー確約" : "競争させる方針";
    return {team:t, salary:sal, years:yrs, need};
  });
}
function moveTeam(p,team,salary,years,ev,word){
  const old=p.team? teamById(p.team) : {name: p.mlbTeam || (p.league==="独立"?"独立リーグ":"—")};
  p.team=team.id; p.salary=salary; p.contract={years,left:years};
  p.uniform=String(p.kind==="投手"?ri(11,60):ri(1,68));
  p.rivals=null; p.manager=null; ensureRivals(p);
  p.career.push({year:p.year,text:`${old.name}→${team.name}（${word}）`});
  p.justMovedYear=p.year;
  ev.push({t:`${team.name}へ移籍。背番号${p.uniform}、年俸${yen(salary)}${years>1?`／${years}年契約`:""}。`,c:"big"});
}

/* ---- コンバート・役割転向 ---- */
const CONVERT_PATH={"捕":["一","三"],"遊":["二","三"],"二":["三","一"],"三":["一"],"中":["左","右"],"左":["一"],"右":["一"],"一":[]};
function convertDecision(p,usage){
  if(p.kind==="投手"||p.ikusei) return null;
  const cands=CONVERT_PATH[p.pos]||[];
  if(!cands.length) return null;
  const blocked = (usage==="二軍"||usage==="控え");
  const worn = p.age>=30 && (p.bat.speed<58 || p.bat.fielding<58);
  if(!(blocked||worn)) return null;
  if(!chance(blocked&&worn?0.55:0.30)) return null;
  const to=pick(cands);
  const reason = worn? `${p.age}歳。守備範囲と動きの衰えを指摘された。` : "同じポジションに厚い壁がある。";
  return {title:"コンバートの打診",
    desc:`${reason}球団から${to}へのコンバートを提案された。新しい守備位置に慣れるまでは守備で苦労する。`,
    options:[
      {label:`${to}に挑戦する`,sub:"出場機会は戻りやすいが、適性が上がるまで評価は下がる",run:()=>{
        p.apt[to]=Math.max(p.apt[to]||0,3); p.pos=to; p.rivals=null; p.justMovedYear=p.year;
        p.career.push({year:p.year,text:`${to}にコンバート`});
        p.pendEv.push({t:`${to}へのコンバートを受け入れた。ここからやり直す。`,c:""});
      }},
      {label:`${p.pos}で勝負を続ける`,sub:"譲らない代わりに、出場機会は保証されない",run:()=>{
        p.pendEv.push({t:"コンバートを断り、今のポジションで勝負を続けることにした。"});
      }}
    ]};
}
function twoWayDecision(p,usage,res){
  if(p.kind!=="二刀流"||p.ikusei) return null;
  const b=batRating(p), q=pitRating(p);
  const gap=Math.abs(b-q);
  const hurt=(p.rehab||0)>0;           // 手術明けは二足の草鞋が難しい
  const blocked=(usage||"").includes("二軍");
  if(p.seasonsPro<2) return null;
  if(!(hurt||blocked||gap>=12||chance(0.22))) return null;
  const why = hurt? "手術明けの体で二刀流を続けるのは難しい、と球団から伝えられた。"
    : blocked? "どちらも中途半端で、一軍に定着できていない。絞るべきだと言われた。"
    : gap>=12? `${b>=q?"打撃":"投球"}の評価が明確に上回っている。どちらかに絞るべきだという声がある。`
    : "二刀流をこのまま続けるか、どちらかに絞るか、球団と話し合う機会が持たれた。";
  const toBat=()=>{
    p.kind="野手"; p.role=null; p.rivals=null; p.rivalsP=null; p.justMovedYear=p.year;
    p.appeal = p.bat.power>=p.bat.meet? "power":"meet";
    p.apt["投"]=Math.min(p.apt["投"]||0,4);
    p.career.push({year:p.year,text:"打者に専念"});
    p.pendEv.push({t:"投手を辞め、打者に専念することを決めた。",c:""});
  };
  const toPit=()=>{
    p.kind="投手"; p.role="先発"; p.pos="投"; p.rivals=p.rivalsP||null; p.rivalsP=null; p.justMovedYear=p.year;
    p.appeal = p.pit.control>=70? "control":"velo";
    p.career.push({year:p.year,text:"投手に専念"});
    p.pendEv.push({t:"打席に立つことをやめ、投手に専念することを決めた。",c:""});
  };
  const opts=[
    {label:"打者に専念する",sub:`打者総合${b}。投手としての能力は落ちていく`,run:toBat},
    {label:"投手に専念する",sub:`投手総合${q}。打席には立たなくなる`,run:toPit}
  ];
  if(!hurt) opts.push({label:"二刀流を続ける",sub:"どちらも伸ばす。登板数と打席数は専任より少ない",run:()=>{
    p.pendEv.push({t:"二刀流を続けることを選んだ。"});}});
  return {title:"二刀流の岐路",desc:why,options:opts};
}
function roleDecision(p,usage){
  if(p.kind!=="投手"||p.ikusei) return null;
  if(p.role==="先発"){
    const fail = usage==="二軍"||usage==="谷間の先発"||p.pit.stamina<52;
    if(!fail||!chance(0.35)) return null;
    return {title:"配置転換の打診",
      desc:"球団から中継ぎへの転向を提案された。短いイニングなら球威を活かせるという判断だった。",
      options:[
        {label:"中継ぎに転向する",sub:"登板機会は増える。先発の座は遠のく",run:()=>{
          p.role="中継ぎ"; p.rivals=null; p.pit.nobi=clamp(p.pit.nobi+4,5,99); p.velo=clamp(p.velo+2,110,172);
          p.career.push({year:p.year,text:"中継ぎに転向"});
          p.pendEv.push({t:"中継ぎへ転向。短いイニングに賭ける。"});
        }},
        {label:"先発にこだわる",sub:"ローテーション争いを続ける",run:()=>{p.pendEv.push({t:"先発にこだわり、転向を断った。"});}}
      ]};
  }
  if(p.role==="中継ぎ"){
    if(!(p.pit.stamina>=68&&p.pit.control>=60&&p.breaks.length>=3)||!chance(0.28)) return null;
    return {title:"先発転向の打診",
      desc:"スタミナと制球を評価され、先発ローテーション入りを打診された。",
      options:[
        {label:"先発に転向する",sub:"1試合の比重が大きくなる。勝ち星とタイトルが狙える",run:()=>{
          p.role="先発"; p.rivals=null; p.pit.stamina=clamp(p.pit.stamina+5,5,99);
          p.career.push({year:p.year,text:"先発に転向"});
          p.pendEv.push({t:"先発へ転向。ローテーションの一角を任される。"});
        }},
        {label:"中継ぎのままでいく",run:()=>{p.pendEv.push({t:"中継ぎとして生きる道を選んだ。"});}}
      ]};
  }
  return null;
}
function goIndy(p){
  p.league="独立"; p.team=null; p.salary=200; p.status="独立リーグ"; p.indyYears=p.indyYears||0;
  p.indyTeam=p.indyTeam||pick(INDY_TEAMS);
  p.ikusei=false; p.rivals=null; p.justMovedYear=p.year;
  p.career.push({year:p.year,text:"独立リーグへ"});
  p.pendEv.push({t:"独立リーグへ。もう一度、ここから。"});
}
function buildDecisions(p,res){
  const D=[];
  const st=res.st, usage=res.usage;
  // --- 戦力外 ---
  // 二軍で圧倒した年は「棒に振った年」とは数えない
  // 一芸での残留にも限度がある
  const niche=NICHE_USAGE.includes(usage) && (p.age<=34 || (p.age<=38 && (p.perfScore||0)>=40));
  const wasted=(usage==="二軍"||usage==="育成")&&(p.farmBoost||0)<7;
  const badYears=(p.badStreak=wasted?(p.badStreak||0)+1:0);
  // 契約期間中の選手と、実力が明らかに高い選手は切られない
  const protectedByAbility = rating(p)>=68 && !p.ikusei && p.age<=39;
  // 一芸で一軍に残れている選手は切られない（極端な高齢を除く）
  // 人気選手と、記録達成が目前の選手は興行面から残される
  const draw = (p.popularity>=72 && p.age<=39 && (p.perfScore||0)>=35)
            || (!!p.milestoneNear && p.age<=41 && (p.perfScore||0)>=25);
  const cutRisk = !p.contractLocked && !protectedByAbility && !(niche&&p.age<=38) && !draw && (
                  (p.ikusei&&p.seasonsPro>=3&&rating(p)<60) ||
                  (badYears>=2) || (p.age>=30&&(p.perfScore||0)<22&&usage==="二軍") ||
                  (p.age>=32&&(p.perfScore||0)<32) || (p.age>=34&&(p.perfScore||0)<48) ||
                  (p.age>=36&&(p.perfScore||0)<60) || (p.age>=39&&(p.perfScore||0)<72));
  if(cutRisk && p.league==="NPB"){
    p.cutCount=(p.cutCount||0)+1;
    const canTest = p.cutCount<=2;   // 二度戦力外になると、NPBのテストを受ける機会は残っていない
    const opts=[];
    if(canTest) opts.push({label:"他球団の入団テストを受ける",sub:"能力と実績次第。落ちれば独立リーグか引退",run:()=>{
          const ok = chance(clamp(((rating(p)-48)/55 + p.popularity/220 + (p.farmBoost||0)*0.035
            + (p.milestoneNear?0.35:0))*(p.age>=36?0.55:p.age>=33?0.8:1),0.05,0.92));
          if(ok&&p.milestoneNear) p.pendEv.push({t:`${p.milestoneNear.name}という記録を花道にしたい、という球団の意向もあった。`});
          if(ok){ const t=pick(TEAMS.filter(x=>x.id!==p.team));
            moveTeam(p,t,Math.max(CONFIG.minSalaryNPB,Math.round(p.salary*0.55/10)*10),1,p.pendEv,"テスト入団");
            p.ikusei=chance(.45); p.status=p.ikusei?"育成":"支配下";
            if(p.ikusei) p.salary=Math.min(p.salary, ri(30,60)*10);   // 育成契約は年俸が大きく下がる
            p.pendEv.push({t:`テストに合格。${p.ikusei?"育成契約":"支配下契約"}で現役続行。`,c:"good"});
          }else{
            p.pendEv.push({t:"テストは不合格。NPBに受け入れ先は見つからなかった。",c:"bad"});
            D.unshift({title:"行き場がない",
              desc:"どの球団からも声は掛からなかった。NPBでプレーする道はこの年はもうない。",
              options:[
                {label:"独立リーグで現役を続ける",sub:"年俸は大きく下がる。NPB復帰の目は残る",run:()=>goIndy(p)},
                {label:"引退する",sub:"ユニフォームを脱ぐ",run:()=>doRetire(p,"受け入れ先がない")}
              ]});
          }
        }});
    opts.push({label:"独立リーグで現役を続ける",sub:"年俸は大きく下がる。復帰の目は残る",run:()=>goIndy(p)});
    opts.push({label:"引退する",sub:"ユニフォームを脱ぐ",run:()=>{ doRetire(p,"戦力外"); }});
    D.push(trainingDecision(p,true));
    D.push({title:"戦力外通告",
      desc:`${teamById(p.team).name}から来季の契約を結ばない旨を告げられた。${p.age}歳。`+
        (p.milestoneNear?`${p.milestoneNear.name}まであと${p.milestoneNear.rest}を残している。`:"")+
        (canTest?"ここからの道を選ぶ。":"二度目の戦力外。NPBからの誘いはもうない。"),
      options:opts});
    return D;
  }
  if(p.league==="独立"){
    p.indyYears=(p.indyYears||0)+1;
    const released = (rating(p)<45 && (p.indyBoost||0)<0.12) || p.indyYears>=5;
    if(released){
      D.push({title:"独立リーグからの戦力外",
        desc:"独立リーグの球団からも来季の契約はないと告げられた。プレーを続ける場所はもうない。",
        options:[{label:"引退する",run:()=>doRetire(p,"プレーする場所がなくなった")}]});
      return D;
    }
    D.push(trainingDecision(p,true));
    const backOdds=Math.round(clamp(clamp((rating(p)-58)/40,0.02,0.6)+(p.indyBoost||0),0.02,0.78)*(p.age>=38?0.3:1)*100);
    D.push({title:"独立リーグの1年",
      desc:`NPB復帰を目指すか、区切りをつけるか。独立${p.indyYears}年目。今の評価なら復帰の可能性はおよそ${backOdds}%。`,
      options:[
        {label:"NPB復帰を目指して続ける",run:()=>{
          const back = clamp(clamp((rating(p)-58)/40,0.02,0.6)+(p.indyBoost||0),0.02,0.78)*(p.age>=38?0.3:1);
          if(chance(back)){
            const t=pick(TEAMS); moveTeam(p,t,CONFIG.minSalaryNPB,1,p.pendEv,"育成契約で復帰");
            p.league="NPB"; p.ikusei=true; p.status="育成";
            p.pendEv.push({t:"NPB球団から育成契約のオファー。再びプロの世界へ。",c:"big"});
          }else p.pendEv.push({t:"声は掛からなかった。"});
        }},
        {label:"引退する",run:()=>doRetire(p,"独立リーグで区切り")}
      ]});
    return D;
  }
  // --- コンバート・配置転換 ---
  if(p.league==="NPB"&&!p.contractLocked){
    const tw=twoWayDecision(p,usage,res); if(tw)D.push(tw);
    const cv=convertDecision(p,usage); if(cv)D.push(cv);
    const rl=roleDecision(p,usage); if(rl)D.push(rl);
  }
  // --- オフの取り組み ---
  if(!p.retired) D.push(trainingDecision(p, p.seasonsPro%3===0));
  // --- 契約更改 ---
  if(p.league==="NPB" && p.contract.left<=1 && !p.contractLocked && !p.retired){
    const next=p.nextSalary||p.salary;
    const multiOK = (p.perfScore||0)>=62 && p.seasonsPro>=3 && p.age<=33;
    const opts=[
      {label:`提示額でサインする（${yen(next)}）`,sub:next>p.salary?`${yen(next-p.salary)}の増額`:next<p.salary?`${yen(p.salary-next)}の減額`:"現状維持",
       run:()=>{p.salary=next;p.contract={years:1,left:1};}},
      {label:"保留して交渉する",sub:"上がることも、こじれることもある",run:()=>{
        const r=rnd();
        if(r<0.55){ p.salary=Math.round(next*rf(1.05,1.18)/10)*10; p.pendEv.push({t:`交渉の末、${yen(p.salary)}でサイン。`,c:"good"}); }
        else if(r<0.85){ p.salary=next; p.pendEv.push({t:`交渉は平行線。${yen(p.salary)}でサイン。`}); }
        else { p.salary=Math.round(next*0.96/10)*10; p.popularity=clamp(p.popularity-3,0,100);
               p.pendEv.push({t:`こじれた末に${yen(p.salary)}でサイン。球団との関係に傷が残った。`,c:"bad"}); }

function mlbValue(p){
  const r=rating(p);
  return Math.pow(Math.max(0,r-64),2)*24000 + marketValue(p)*160 + rf(400000,2600000);
}

/* ============ MLB ============ */
function ensureMlbRivals(p){
  const t=mlbTeamById(p.mlbTeam)||MLB_TEAMS[0];
  if(!p.mlbRivals) p.mlbRivals=[];
  const want = p.kind==="投手"?4:3;
  while(p.mlbRivals.length<want)
    p.mlbRivals.push({name:jname(true),age:ri(23,32),
      ab:Math.round(clamp(rf(62,90)+(t.power-82)*0.35,45,99))});
}
function ageMlbRivals(p,ev){
  const t=mlbTeamById(p.mlbTeam)||MLB_TEAMS[0];
  p.mlbRivals.forEach(r=>{ r.age++;
    r.ab=clamp(Math.round(r.ab+(r.age<=27?rf(0.5,3.5):r.age<=31?rf(-1.5,1.5):rf(-6,-0.5))),40,99); });
  p.mlbRivals=p.mlbRivals.filter(r=>!(r.age>=36&&chance(.5))&&!(r.ab<55&&chance(.5)));
  if(chance(t.money/900)){ const nr={name:jname(true),age:ri(24,31),ab:Math.round(clamp(rf(74,94)+(t.power-82)*0.3,50,99))};
    p.mlbRivals.push(nr); if(ev)ev.push({t:`${p.mlbTeam}が${nr.name}を大型契約で獲得した。`}); }
  ensureMlbRivals(p);
}
function mlbStandings(p,contribution){
  const rows=MLB_TEAMS.map(t=>({id:t.id,lg:t.lg,
    v:t.power+gauss()*8+(t.id===p.mlbTeam?(contribution||0):0)}));
  const avgV=rows.reduce((a,b)=>a+b.v,0)/rows.length;
  rows.forEach(r=>{ r.wRaw=clamp(81+(r.v-avgV)*0.95,55,112); });
  rows.sort((a,b)=>b.wRaw-a.wRaw);
  rows.forEach((r,i)=>{ r.rank=i+1; r.w=Math.round(r.wRaw); r.l=CONFIG.gamesMLB-r.w; });
  for(let i=1;i<rows.length;i++) if(rows[i].w>rows[i-1].w){ rows[i].w=rows[i-1].w; rows[i].l=CONFIG.gamesMLB-rows[i].w; }
  return rows;
}
function simMLBYear(p){
  const ev=[];
  p.mlbYears++;
  ensureMlbRivals(p);
  if(p.mlbYears>1) ageMlbRivals(p,ev);
  if(!p.manager||!p.manager.mlb){ p.manager={name:pick(MLB_MANAGERS),style:pick(MANAGER_STYLES),since:p.year,trust:50,mlb:true};
    ev.push({t:`${p.manager.name}監督の下でプレーする。方針は${p.manager.style}。`}); }
  else if((p.manager.years=(p.manager.years||0)+1)>=ri(3,6)){
    const old=p.manager.name; p.manager={name:pick(MLB_MANAGERS),style:pick(MANAGER_STYLES),since:p.year,trust:50,mlb:true};
    ev.push({t:`${old}監督が退任し、${p.manager.name}監督が就任。`});
  }
  const adapt = p.mlbYears===1? -9 : p.mlbYears===2? -3 : 0;
  const tmp=JSON.parse(JSON.stringify(p));
  BATK.forEach(([k])=>tmp.bat[k]=clamp(tmp.bat[k]+adapt,5,99));
  PITK.forEach(([k])=>tmp.pit[k]=clamp(tmp.pit[k]+adapt,5,99));
  tmp.league="MLB"; tmp.team=p.team||"grands";
  const r=rating(tmp);
  // チーム内の序列で起用が決まる
  const abs=(p.mlbRivals||[]).map(r=>r.ab).sort((a,b)=>b.a-a.b);
  const sorted=(p.mlbRivals||[]).map(r=>r.ab).sort((a,b)=>b-a);
  const R1=sorted[0]!==undefined?sorted[0]:80, R2=sorted[1]!==undefined?sorted[1]:72;
  const trustB=((p.manager&&p.manager.trust||50)-50)*0.08;
  const usageForP = v0 => { const v=v0+trustB;
    return v>=R1+2?"ローテ上位":v>=R2?"ローテ下位":v>=R2-8?"谷間の先発":"二軍"; };
  const usageForB = v0 => { const v=v0+trustB;
    return v>=R1+3?"不動のレギュラー":v>=R1-3?"レギュラー":v>=R2-2?"準レギュラー":v>=R2-11?"控え":"二軍"; };
  let usage, usageB=null, usageP=null;
  if(p.kind==="投手") usage = usageForP(pitRating(tmp));
  else if(p.kind==="二刀流"){ usageB=usageForB(batRating(tmp)); usageP=usageForP(pitRating(tmp));
    usage = (usageB==="二軍"&&usageP==="二軍")? "二軍" : `${usageB}／${usageP}`; }
  else usage = usageForB(batRating(tmp));
  const inj=injuryCheck(p,usage==="二軍"?0.3:0.85,ev);
  let st;
  if(usage==="二軍") st=simFarmStats(tmp,inj?inj.miss:0);
  else if(p.kind==="二刀流"){
    const miss=inj?inj.miss:0;
    const sb=usageB==="二軍"? null : simSeasonStats(tmp,usageB,miss,{as:"b"});
    const sp=usageP==="二軍"? null : simSeasonStats(tmp,usageP,Math.min(0.9,miss+0.25),{as:"p"});
    st = sb&&sp? Object.assign({},sb,{two:true,pit:sp,usageB,usageP}) : (sb||sp);
  }
  else st=simSeasonStats(tmp,usage,inj?inj.miss:0);
  if(usage==="二軍") ev.push({t:"メジャー昇格なし。1年を3Aで過ごした。",c:"bad"});
  p.lastERA=(st&&st.type==="p"&&!st.farm)?st.era:null;
  p.seasonsPro++; p.mlbUsage=usage;
  ev.unshift({t:`${p.mlbTeam}／${usage==="二軍"?"3A中心":usage}`});
  const good = (!st||st.farm)? false : st.two? (st.ops>=.790||st.pit.era<=3.40)
    : st.type==="b"? (st.ops>=.800&&st.g>=110) : (st.era<=3.30&&(st.gs>=18||st.g>=45));
  if(good){ p.awards.push({year:p.year,name:"MLBオールスター"}); ev.push({t:"オールスターに選出された。",c:"good"}); }
  const mlbTitles = judgeAwardsMLB(p,st,usage,ev);
  recordEvents(p,st,usage,ev);
  nationalTeam(p,st,usage,ev);
  milestoneCheck(p,st,ev);
  // 順位とポストシーズン
  const table=mlbStandings(p,clamp(((p.perfScore||0)-45)*0.12,-5,12));
  p.mlbTable=table;
  const me=table.find(x=>x.id===p.mlbTeam)||{rank:14,w:70};
  const lgRows=table.filter(x=>x.lg===(mlbTeamById(p.mlbTeam)||{lg:"AL"}).lg);
  const lgRank=lgRows.findIndex(x=>x.id===p.mlbTeam)+1;
  p.lastRank=lgRank; p.lastChamp=false;
  ev.push({t:`${p.mlbTeam}は${me.w}勝。リーグ${lgRank}位。`});
  if(lgRank<=3&&st&&!st.farm){
    const r=rnd();
    if(r<0.16){ p.awards.push({year:p.year,name:"ワールドシリーズ制覇"}); p.lastChamp=true;
      ev.push({t:`${p.mlbTeam}がワールドシリーズを制した。`,c:"big"}); p.popularity=clamp(p.popularity+10,0,100); }
    else if(r<0.32) ev.push({t:`${p.mlbTeam}はワールドシリーズに進出したが敗れた。`,c:"good"});
    else if(r<0.60) ev.push({t:`${p.mlbTeam}はリーグ優勝決定シリーズで敗れた。`});
    else ev.push({t:`${p.mlbTeam}はディビジョンシリーズで敗れた。`});
  }else ev.push({t:`${p.mlbTeam}はポストシーズンを逃した。`});
  if(p.manager){ const before=p.manager.trust||50;
    p.manager.trust=clamp(Math.round(before+clamp(((p.perfScore||0)-45)*0.22,-12,12)),0,100); }
  growPlayer(p,usage==="二軍"?0.8:1.0);
  if(!p.ikusei&&(p.perfScore||0)>=85&&Number(p.uniform)>9&&chance(.45)){
    const n=String(ri(1,9));
    ev.push({t:`来季から背番号${n}を背負うことになった。`,c:"good"});
    p.uniform=n;
  }
  p.ratingLog=(p.ratingLog||[]).concat([{year:p.year,v:rating(p)}]).slice(-30);
  p.perfScore= (!st||st.farm)? 6
    : st.two? clamp(perfScore(p,st,st.usageB)+perfScore(p,st.pit,st.usageP)*0.55,0,140)
    : perfScore(p,st,usage);
  return {ev,st,usage,titles:mlbTitles,rank:null};
}

/* ============ トレード・現役ドラフト ============ */
function randomMoves(p,res){
  if(p.league!=="NPB"||p.retired)return;
  const usage=res.usage;
  const t=teamById(p.team);
  // 現役ドラフト
  if(!p.ikusei&&p.seasonsPro>=2&&!faDomesticOK(p)&&(usage==="二軍"||usage==="控え"||usage==="ビハインド")&&chance(.16)){
    // 出場機会を与えられる＝戦力が整っていない球団が獲りにくる
    const cand=TEAMS.filter(x=>x.id!==p.team).sort((a,b)=>(teamPower(p,a.id)+rnd()*12)-(teamPower(p,b.id)+rnd()*12));
    const to=cand[0];
    moveTeam(p,to,Math.max(CONFIG.minSalaryNPB,Math.round(p.salary*1.05/10)*10),1,p.pendEv,"現役ドラフト");
    p.pendEv.push({t:"現役ドラフトで指名を受けた。出場機会を求めての移籍となる。",c:""});
    return;
  }
  // トレード
  const tradeP = (usage==="二軍"?0.10:usage==="控え"?0.07:0.025)
               + (p.age>=31&&p.salary>8000?0.06:0) + (t.dev>82&&p.age>=30?0.05:0);
  if(chance(tradeP)&&p.contract.left<=1){
    // 勝負をかけている球団、あるいは若返りを進める球団が動く
    const cand=TEAMS.filter(x=>x.id!==p.team);
    const wt=x=>(p.age<=27? teamPower(p,x.id)*0.6+x.dev*0.5 : teamPower(p,x.id)*0.9)+rnd()*25;
    const to=cand.sort((a,b)=>wt(b)-wt(a))[0];
    moveTeam(p,to,p.salary,1,p.pendEv,"トレード");
    p.pendEv.push({t:"トレードが成立した。拒否権はなかった。",c:""});
  }
}

/* ============ 引退 ============ */
function retireCheck(p,res){
  if(p.retired)return [];
  const D=[];
  // 移籍や再契約を決めた直後の年は、本人の意思に反する引退判定を挟まない
  if(p.justMovedYear===p.year||p.contract.left>1) return D;
  const decline = rating(p) < (p.peakRating||60)*0.78;
  if((p.age>=32&&decline&&(p.perfScore||0)<38)||(p.age>=36&&(p.perfScore||0)<52)||p.age>=38||p.age>=40){
    D.push({title:"進退",desc: p.age>=40
      ? `${p.age}歳。これだけ長くやれたこと自体が例外だ。来季をどうするか。`
      : `${p.age}歳。体は言うことを聞かなくなってきた。来季をどうするか。`,
      options:[
        {label:"現役を続ける",run:()=>{}},
        {label:"引退を決断する",sub:"通算成績が確定する",run:()=>doRetire(p,"自らの決断")}
      ]});
  }
  return D;
}
