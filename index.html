    if(p.kind!=="投手") p.pendEv.push({t:pick(["最終打席は右前へのヒット。ベンチもスタンドも沸いた。","最終打席は空振り三振。それでも拍手は鳴り止まなかった。","最終打席で放った打球は、静かに外野手のグラブに収まった。"])});
    else p.pendEv.push({t:pick(["最後の打者を空振り三振に仕留め、マウンドを降りた。","最後の一球は力の限りの直球だった。","最終回を投げ切り、ナインに迎えられた。"])});
    p.pendEv.push({t:`セレモニーでは${p.seasonsPro}年間を共にしたチームメイトに胴上げされた。`,c:"good"});
    if(p.popularity>=60) p.pendEv.push({t:"場内一周では、涙をこらえきれないファンの姿もあった。"});
  }else if(t){
    p.pendEv.push({t:"引退試合はなかった。二軍の球場で、静かにユニフォームを脱いだ。"});
  }else{
    p.pendEv.push({t:"球団も、引退試合もない。それでも、野球をやめる日は来た。"});
  }
}

/* ============ 記録（メモリアル） ============ */
const MILESTONES=[
  {key:"h",  name:"通算2000安打", v:2000, per:130},
  {key:"hr", name:"通算500本塁打", v:500, per:28},
  {key:"hr2",name:"通算300本塁打", v:300, per:28, of:"hr"},
  {key:"w",  name:"通算200勝",    v:200, per:11},
  {key:"sv", name:"通算250セーブ", v:250, per:28},
  {key:"so", name:"通算2000奪三振", v:2000, per:130}
];
function totalsWith(p,st){
  const t=careerTotals(p,false);
  if(st&&!st.farm){
    if(st.type==="b"||st.two){ t.b.h+=st.h||0; t.b.hr+=st.hr||0; t.b.g+=st.g||0; }
    const q=st.two? st.pit : (st.type==="p"? st : null);
    if(q){ t.q.w+=q.w||0; t.q.sv+=q.sv||0; t.q.so+=q.so||0; }
  }
  return t;
}
function milestoneCheck(p,st,ev){
  const before=careerTotals(p,false), after=totalsWith(p,st);
  const val=(t,k)=> k==="h"?t.b.h : (k==="hr"||k==="hr2")?t.b.hr : k==="w"?t.q.w : k==="sv"?t.q.sv : t.q.so;
  p.milestoneNear=null;
  MILESTONES.forEach(m=>{
    const b=val(before,m.key), a=val(after,m.key);
    if(b<m.v && a>=m.v){
      p.awards.push({year:p.year,name:m.name});
      ev.push({t:`${m.name}を達成した。`,c:"big"});
      p.popularity=clamp(p.popularity+12,0,100);
    }
    // 次の1〜2年で届く位置にいるか
    const rest=m.v-a;
    if(rest>0 && rest<=m.per*1.6 && !p.milestoneNear) p.milestoneNear={name:m.name,rest};
  });
  if(p.milestoneNear&&p.age>=32)
    ev.push({t:`${p.milestoneNear.name}まであと${p.milestoneNear.rest}。球団も記録達成を意識している。`});
}

/* ============ 通算成績 ============ */
function careerTotals(p,includeAmateur){
  const b={g:0,pa:0,ab:0,h:0,hr:0,rbi:0,sb:0,bb:0,so:0,d2:0,d3:0};
  const q={g:0,gs:0,ip:0,w:0,l:0,sv:0,hld:0,so:0,bb:0,er:0};
  p.history.forEach(x=>{
    if(x.amateur&&!includeAmateur)return;
    if(x.league==="独立")return;          // 通算は一軍の成績のみ
    const s=x.st; if(!s||s.farm)return;
    if(s.type==="b"){["g","pa","ab","h","hr","rbi","sb","bb","so","d2","d3"].forEach(k=>b[k]+=s[k]||0);}
    else{["g","gs","w","l","sv","hld","so","bb"].forEach(k=>q[k]+=s[k]||0);q.ip+=s.ip||0;q.er+=(s.era*s.ip/9)||0;}
    if(s.two&&s.pit){["g","gs","w","l","sv","hld","so","bb"].forEach(k=>q[k]+=s.pit[k]||0);q.ip+=s.pit.ip||0;q.er+=(s.pit.era*s.pit.ip/9)||0;}
  });
  b.avg=b.ab? b.h/b.ab:0;
  q.era=q.ip? q.er*9/q.ip:0;
  q.ip=Math.round(q.ip*10)/10;
  return {b,q};
}
function leagueTotals(p,lg){
  const b={g:0,h:0,hr:0,rbi:0,sb:0}, q={g:0,w:0,l:0,sv:0,hld:0,so:0,ip:0};
  let years=0;
  p.history.forEach(x=>{
    if(x.amateur)return;
    if(x.league==="独立")return;
    const inLg = lg==="MLB" ? x.league==="MLB" : (x.league!=="MLB");
    if(!inLg)return;
    const s=x.st;
    if(!s||!s.farm) years++;
    if(!s||s.farm)return;
    if(s.type==="b"){["g","h","hr","rbi","sb"].forEach(k=>b[k]+=s[k]||0);}
    else{["g","w","l","sv","hld","so"].forEach(k=>q[k]+=s[k]||0); q.ip+=s.ip||0;}
    if(s.two&&s.pit){["g","w","l","sv","hld","so"].forEach(k=>q[k]+=s.pit[k]||0); q.ip+=s.pit.ip||0;}
  });
  q.ip=Math.round(q.ip*10)/10;
  return {b,q,years};
}
function epilogue(p){
  const {b,q}=careerTotals(p,false);
  const isP=p.kind==="投手";
  const npb=leagueTotals(p,"NPB"), mlb=leagueTotals(p,"MLB");
  const lines=[];
  // 名球会（日米通算で判定）
  const meikyukai = p.kind==="二刀流"? (b.h>=2000||q.w>=200||q.sv>=250) : isP? (q.w>=200||q.sv>=250) : b.h>=2000;
  const titleN=p.titles.length;
  const mvpN=p.awards.filter(a=>a.name==="リーグMVP").length;
  const bnN=p.awards.filter(a=>a.name==="ベストナイン").length;
  const sawamuraN=p.awards.filter(a=>a.name==="沢村賞").length;
  const asNPB=p.awards.filter(a=>a.name==="オールスター出場").length;
  const asMLB=p.awards.filter(a=>a.name==="MLBオールスター").length;
  // 日本の野球殿堂：NPBでの実績で判定
  let npbScore = titleN*9 + mvpN*12 + bnN*4 + sawamuraN*8 + asNPB*1.5 + (meikyukai?28:0)
    + (isP? npb.q.w*0.24 + npb.q.sv*0.18 + npb.q.so*0.004 : npb.b.h*0.011 + npb.b.hr*0.05);
  const npbHof = npb.years>=10 && npbScore>=145;
  // アメリカ野球殿堂：メジャーでの実績で判定（10年以上の在籍が条件）
  const mlbTitleN=p.titles.filter(t=>t.name.includes("（MLB）")).length;
  const cyN=p.awards.filter(a=>a.name==="サイ・ヤング賞").length;
  const mvpMLB=p.awards.filter(a=>a.name==="MVP（MLB）").length;
  const ws=p.awards.filter(a=>a.name==="ワールドシリーズ制覇").length;
  let mlbScore = asMLB*7 + mlb.years*1.5 + mlbTitleN*9 + cyN*13 + mvpMLB*15 + ws*4
    + (isP? mlb.q.w*0.5 + mlb.q.so*0.015 + mlb.q.sv*0.25 : mlb.b.h*0.02 + mlb.b.hr*0.12);
  const mlbHof = mlb.years>=10 && mlbScore>=130;
  const eien = npbHof && p.career.filter(c=>c.text.includes("→")).length<=1 && npb.years>=14;
  const reasonText={
    "戦力外":"戦力外通告を受け","自らの決断":"自らの意思で","受け入れ先がない":"受け入れ先が見つからず",
    "独立リーグで区切り":"独立リーグで区切りをつけ","メジャーで区切り":"メジャーで区切りをつけ",
    "プレーする場所がなくなった":"プレーする場所がなくなり","プロの道が絶たれた":"プロへの道が絶たれ"
  }[p.retireReason]||p.retireReason;
  if(p.seasonsPro===0) lines.push(`${p.year}年、${reasonText}、野球から離れた。`);
  else lines.push(`${p.seasonsPro}年の現役生活。${reasonText}、${p.year}年に引退した。`);
  if(mlb.years>0) lines.push(`日本${npb.years}年、メジャー${mlb.years}年。`);
  if(meikyukai)lines.push("日米通算の成績が名球会入りの条件を満たした。");
  if(npbHof)lines.push("後年、日本の野球殿堂入りを果たした。");
  if(mlbHof)lines.push("アメリカ野球殿堂（クーパーズタウン）にも名を刻んだ。");
  if(npbHof&&mlbHof)lines.push("日米双方の殿堂に入った、稀有な選手として記憶されている。");
  if(eien)lines.push(`背番号${p.uniform}は永久欠番となった。`);
  if(!npbHof&&!mlbHof&&!meikyukai&&titleN===0&&p.seasonsPro>=8)
    lines.push("記録に残る選手ではなかった。それでも、その年月は確かにあった。");
  const big = npbHof||mlbHof||titleN>=3;
  let career2;
  if(big) career2=pick(["一軍打撃コーチ","二軍監督","解説者","評論家"]);
  else if(p.popularity>=60) career2=pick(["テレビ解説者","タレント","少年野球の指導者"]);
  else if(p.seasonsPro>=10) career2=pick(["スカウト","球団職員","打撃投手","トレーニングコーチ"]);
  else career2=pick(["社会人チームの指導者","飲食店の経営者","一般企業の会社員","独立リーグのコーチ"]);
  lines.push(`引退後は${career2}となった。`);
  // その後
  if(big&&chance(0.55)){
    const t=p.team? teamById(p.team):pick(TEAMS);
    const yr=p.year+ri(4,9);
    lines.push(`${yr}年、${(t||TEAMS[0]).name}の監督に就任。`);
    const res=pick(["就任3年目にリーグ優勝を果たした。","チームの再建に取り組んだが、優勝には届かなかった。","若手を育て、常勝チームの土台を作った。","成績が振るわず、3年で退任した。"]);
    lines.push(res);
  }else if(p.seasonsPro>=12&&chance(0.4)){
    lines.push(`${p.year+ri(3,8)}年、指導者として一軍のコーチに昇格した。`);
  }else if(!big&&p.seasonsPro<8&&chance(0.35)){
    lines.push("野球とは違う場所で、静かに暮らしている。");
  }
  return {lines,b,q,npb,mlb,meikyukai,npbHof,mlbHof,hof:npbHof||mlbHof,eien,npbScore,mlbScore};
}
/* ============ アマチュア（大学・社会人・独立） ============ */
const AMA_LV={"大学":80,"社会人":86,"独立リーグ":70};
const AMA_LEN={"大学":4,"社会人":3,"独立リーグ":1};
function simAmateur(p){
  const ev=[]; const lv=AMA_LV[p.amaType];
  const r=rating(p);
  // 新加入の1年目だけ壁がある。同じカテゴリで続投する2クール目は既存戦力として扱う
  const need=lv*0.70+((p.amaYear===1&&!p.amaContinued)?8:0);
  let playing = r>=need+10?"主力":r>=need?"レギュラー":r>=need-9?"控え":"ベンチ外";
  ev.push({t:`${p.amaType}${p.amaType==="大学"?p.amaYear+"年":""}。${playing}。`});
  const teamStr=lv+gauss()*7;
  if(p.amaType==="大学"&&teamStr>84) ev.push({t:"リーグ優勝。全日本大学選手権に出場した。"});
  if(p.amaType==="社会人"&&teamStr>86) ev.push({t:"都市対抗野球に出場。補強選手としての評価も上がった。"});
  let stat=null;
  if(playing!=="ベンチ外"){
    const g=playing==="主力"?ri(28,42):playing==="レギュラー"?ri(20,32):ri(8,18);
    let pst=null,bst=null;
    if(p.kind!=="野手"){
      const pg = p.kind==="二刀流"? Math.max(4,Math.round(g*0.55)) : g;
      const era=clamp(4.10-(p.pit.control-42)*.038-(p.velo-134)*.060-breakScore(p)*.016+gauss()*.42,0.10,8);
      const ip=Math.round(pg*rf(4.5,7));
      pst={type:"p",g:pg,ip,era:+era.toFixed(2),so:Math.round(ip*rf(.7,1.25)),w:Math.round(pg*rf(.2,.5)),l:Math.round(pg*rf(.05,.3))};
      if(p.velo>=150){ev.push({t:`最速${p.velo}km/h。スカウトが列をなした。`,c:"good"});p.popularity=clamp(p.popularity+7,0,100);}
    }
    if(p.kind!=="投手"){
      const ab2=Math.round(g*rf(3,3.8));
      const avg=clamp(.240+(p.bat.meet-42)*.0035+gauss()*.036,.110,.480);
      const hr=Math.max(0,Math.round(ab2*Math.max(0,(p.bat.power-36))/700*(0.6+p.ballistic*.28)+gauss()*.5));
      bst={type:"b",g,ab:ab2,h:Math.round(ab2*avg),avg:+avg.toFixed(3),hr,sb:Math.round(g*Math.max(0,(p.bat.speed-48))/110)};
    }
    stat = (bst&&pst)? Object.assign({},bst,{two:true,pit:pst}) : (pst||bst);
    p.popularity=clamp(p.popularity+(playing==="主力"?4:1),0,100);
  }
  rehabStep(p,ev);
  p.lastPlaying=playing;
  p.playHistory=(p.playHistory||[]).concat([playing]).slice(-3);
  growPlayer(p, playing==="ベンチ外"?0.8:1.05);
  injuryCheck(p,0.5,ev);
  return {ev,stat,playing};
}

/* ============ 進行 ============ */
const S={p:null,tab:"log",decisions:[],post:null,seedText:""};

function draftChoice(p,ev){
  const d=runDraft(p,ev);
  const routes=[];
  const toAma=(type,sub)=>({label:type==="大学"?"大学に進む":type==="社会人"?"社会人野球に進む":"独立リーグでプレーする",sub,
    run:()=>{p.amaContinued=(p.amaType===type);p.stage="ama";p.amaType=type;p.amaYear=1;p.faType="college";}});
  const canRetry = p.age<=25;   // アマチュアでの再挑戦は25歳まで
  if(!canRetry){
    // これ以上アマチュアで粘る道はない
  } else if(p.stage==="hs"){
    routes.push(toAma("大学","4年後に再挑戦。体も技術も伸びる"));
    routes.push(toAma("社会人","3年後に再挑戦。即戦力評価を狙う"));
    routes.push(toAma("独立リーグ","毎年ドラフトに挑戦できる"));
  }else if(canRetry&&p.amaType==="大学"){
    routes.push(toAma("社会人","3年後に再挑戦"));
    routes.push(toAma("独立リーグ","毎年ドラフトに挑戦できる"));
  }else if(canRetry&&p.amaType==="社会人"){
    routes.push(toAma("社会人","もう3年、主力として都市対抗で勝負する"));
    routes.push(toAma("独立リーグ","毎年ドラフトに挑戦できる"));
  }else if(canRetry){
    routes.push(toAma("独立リーグ","来年もドラフトに挑む"));
  }
  routes.push({label:"野球をやめる",sub:canRetry?"ここで物語は終わる":"年齢的にこれ以上の再挑戦はできない",
    run:()=>{p.stage="end";p.retired=true;p.retireReason="プロの道が絶たれた";}});
  if(d){
    const word = d.ikusei? `育成${d.rank}位`:`${d.rank}位`;
    ev.push({t:`ドラフト会議、${d.team.name}が${word}で指名。`,c:"big"});
    const opts=[{label:`${d.team.name}に入団する`,sub:`${word}指名・${d.ikusei?"育成契約":"支配下契約"}`,
      run:()=>{joinTeam(p,d.team,d.rank,d.ikusei);
        p.pendEv.push({t:`${d.team.name}に入団。背番号${p.uniform}、年俸${yen(p.salary)}。`,c:"big"});
        p.career.push({year:p.year,text:`${d.team.name}に${word}で入団`});}}];
    S.decisions=[{title:"進路の決定",desc:"指名を受け入れるか、別の道を選ぶか。",options:opts.concat(routes.slice(0,routes.length-1)).concat(routes.slice(-1))}];
  }else{
    S.decisions=[{title:"進路の決定",desc:"指名はなかった。ここからどうするか。",options:routes}];
  }
}

function pushHistory(p,label,usage,st,ev,extra){
  p.history.push(Object.assign({year:p.year,age:p.age,label,usage,st,ev},extra||{}));
}

function snapshot(){
  if(!S.p)return;
  try{ S.undo={p:JSON.parse(JSON.stringify(S.p)),rng:RNG_STATE,year:S.p.year}; }catch(e){ S.undo=null; }
}
function undoYear(){
  if(!S.undo){ toast("戻せる記録がありません"); return; }
  S.p=S.undo.p; setSeed(S.undo.rng); S.decisions=[]; S.post=null; S.confirm=null; S.undo=null;
  save(); S.tab="log"; render(); toast("1年分を取り消しました");
}
function advance(){
  const p=S.p; if(!p||S.decisions.length||p.retired)return;
  snapshot();
  p.pendEv=[];
  if(p.stage==="hs"){
    const r=simHighSchool(p); p.pendEv=r.ev;
    pushHistory(p,`${p.schoolName||p.school} ${p.hsYear}年`,r.playing,r.stat,r.ev,{amateur:true});
    const last=p.hsYear===3;
    p.hsYear++; p.age++; p.year++;
    if(last) draftChoice(p,r.ev);
    else S.decisions=[trainingDecision(p,p.hsYear===3)];
  }
  else if(p.stage==="ama"){
    const r=simAmateur(p); p.pendEv=r.ev;
    pushHistory(p,`${p.amaType}${p.amaType==="大学"?p.amaYear+"年":""}`,r.playing,r.stat,r.ev,{amateur:true});
    const last=p.amaYear>=AMA_LEN[p.amaType];
    p.amaYear++; p.age++; p.year++;
    if(last){ p.amaYear=1; draftChoice(p,r.ev); }
    else S.decisions=[trainingDecision(p,true)];
  }
  else if(p.stage==="pro"){
    const res = p.league==="MLB"? simMLBYear(p) : p.league==="独立"? simIndyYear(p) : simProYear(p);
    p.pendEv=res.ev;
    p.peakRating=Math.max(p.peakRating||0,rating(p));
    const teamLabel = p.league==="MLB"? (p.mlbTeam||"MLB") : p.league==="独立"? (p.indyTeam||"独立リーグ") : ((teamById(p.team)||{}).name||"—");
    pushHistory(p, teamLabel, res.usage, res.st, res.ev,
      {league:p.league,salary:p.league==="MLB"?p.mlbSalary:p.salary,rank:res.rank});
    p.age++; p.year++;
    S.decisions = p.league==="MLB"? mlbOffseason(p,res) : buildDecisions(p,res);
    S.post=()=>{
      if(p.retired)return;
      randomMoves(p,res);
      const D=retireCheck(p,res);
      if(D.length)S.decisions=D;
    };
    pruneDecisions();
    if(!S.decisions.length){ const f=S.post;S.post=null;f&&f(); pruneDecisions(); }
  }
  if(p.retired&&!p.recorded){ p.recorded=true; recordLife(p); }
  save(); render();
}
function pruneDecisions(){
  const p=S.p; if(!p)return;
  // 配列は作り直さず中身だけ削る（選択肢の run が同じ配列を参照しているため）
  const keep=S.decisions.filter(d=>!p.retired && (!d.npb || (p.league==="NPB"&&p.team)));
  if(keep.length!==S.decisions.length){ S.decisions.length=0; keep.forEach(d=>S.decisions.push(d)); }
}
function chooseOption(i){
  const d=S.decisions[0]; if(!d)return;
  const o=d.options[i];
  const wasRetired=S.p?S.p.retired:false;
  S.decisions.shift();
  o.run();
  pruneDecisions();
  if(S.p&&S.p.retired&&!wasRetired&&!S.p.recorded){ S.p.recorded=true; recordLife(S.p); }
  if(!S.decisions.length && S.post){ const f=S.post; S.post=null; f(); pruneDecisions(); }
  save(); render();
}

/* ============ 表示 ============ */
function fmtAvg(v){ const s=Math.round(v*1000); return (s>=1000?"1.000":"."+String(s).padStart(3,"0")); }
/* OPSや長打率は1を超えるので、頭打ちにしない */
function fmtRate(v){
  if(v==null||isNaN(v)) return "—";
  if(v>=1) return v.toFixed(3);
  return "."+String(Math.round(v*1000)).padStart(3,"0");
}
function statLine(st){
  if(!st)return "";
  if(st.two&&st.pit){
    const b=st, q=st.pit;
    let l1=`<b>打者</b> ${b.g}試合 打率${fmtAvg(b.avg)} ${b.hr}本`+(b.rbi!==undefined?` ${b.rbi}打点`:"");
    let l2=`<b>投手</b> ${q.g}登板 `+(q.w!==undefined?`${q.w}勝${q.l}敗 `:"")+`防御率${q.era.toFixed(2)} ${q.ip}回`+(q.so!==undefined?` ${q.so}奪三振`:"");
    const kv=[];
    if(b.runs!==undefined) kv.push(`<span>得点 <b>${b.runs}</b></span>`);
    if(b.sb!==undefined) kv.push(`<span>盗塁 <b>${b.sb}</b></span>`);

function yearCard(h,now){
  const all=(h.ev||[]);
  const line=e=>`<div class="ev ${e.c||""}">${e.t}</div>`;
  let ev;
  if(all.length<=4){ ev=all.map(line).join(""); }
  else{
    const keep=[], rest=[];
    all.forEach((e,i)=>{ if(i===0||e.c==="big"||e.c==="bad"||(e.c==="good"&&keep.length<3)) keep.push(e); else rest.push(e); });
    while(keep.length<3&&rest.length) keep.push(rest.shift());
    ev=keep.map(line).join("")+(rest.length?`<details><summary class="cap">他${rest.length}件の出来事</summary>${rest.map(line).join("")}</details>`:"");
  }
  return `<div class="card yearcard">
    <div class="hdline"><span class="y">${h.year}年</span><span class="a">${h.age}歳・${h.label}</span></div>
    ${ev}${h.st?`<div class="statline">${statLine(h.st)}${h.salary?`<div class="kv"><span>この年の年俸 <b>${h.league==="MLB"?usd(h.salary):yen(h.salary)}</b></span></div>`:""}</div>`:""}
  </div>`;
}
function abilBar(label,v,d){
  const dd = d? `<span class="d ${d>0?"up":"dn"}">${d>0?"+":""}${d}</span>`:"";
  return `<div class="abil"><span>${label}</span><span class="v num">${v} <span class="muted small">${grade(v)}</span>${dd}</span>
    <span class="bar"><i style="width:${v}%"></i></span></div>`;
}
function sparkline(values,labels,color,fmt){
  if(values.length<2) return "";
  const w=320,h=92,pad=6;
  const mx=Math.max(...values), mn=Math.min(...values);
  const span=(mx-mn)||1;
  const x=i=>pad+i*(w-pad*2)/(values.length-1);
  const y=v=>h-14-((v-mn)/span)*(h-26);
  const pts=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block">`;
  g+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`;
  values.forEach((v,i)=>{ g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${color}"/>`; });
  g+=`<text x="${pad}" y="10" fill="#8FA59B" font-size="10">${fmt(mx)}</text>`;
  g+=`<text x="${pad}" y="${h-2}" fill="#8FA59B" font-size="10">${fmt(mn)}　${labels[0]}〜${labels[labels.length-1]}</text>`;
  return g+"</svg>";
}
/* その年ひとつを取り出す：最も良かったシーズン */
function seasonScore(p,h){
  const st=h.st; if(!st||st.farm) return -1;
  try{
    if(st.two&&st.pit) return perfScore(p,st,st.usageB||h.usage)+perfScore(p,st.pit,st.usageP||h.usage)*0.55;
    return perfScore(p,st,h.usage);
  }catch(e){ return -1; }
}
function bestSeasonCard(p){
  const rows=p.history.filter(h=>!h.amateur&&h.st&&!h.st.farm&&h.league!=="独立");
  if(rows.length<2) return "";
  const best=rows.reduce((a,b)=>seasonScore(p,b)>seasonScore(p,a)?b:a);
  const badges=[].concat(
    p.titles.filter(t=>t.year===best.year).map(t=>t.name),
    p.awards.filter(a=>a.year===best.year).map(a=>a.name)
  );
  const sal = best.salary? (best.league==="MLB"? usd(best.salary) : yen(best.salary)) : "—";
  return `<div class="card" style="border-color:var(--acc)">
    <h3>ベストシーズン</h3>
    <div class="hdline" style="display:flex;align-items:baseline;gap:8px;margin:2px 0 6px">
      <span class="y" style="font-size:19px;font-weight:700">${best.year}年</span>
      <span class="a cap">${best.age}歳・${(best.league==="MLB"?"米 ":"")+esc(best.label)}${best.usage?`・${esc(best.usage)}`:""}</span></div>
    <div class="statline">${statLine(best.st)}
      <div class="kv"><span>この年の年俸 <b>${sal}</b></span>${best.rank?`<span>チーム <b>${best.rank}位</b></span>`:""}</div></div>
    ${badges.length?`<div style="margin-top:8px">${badges.map(b=>`<span class="title-badge">${esc(b)}</span>`).join("")}</div>`:`<p class="cap" style="margin-top:8px">この年はタイトルには届かなかった。</p>`}
  </div>`;
}
function bestCard(p){
  const rows=p.history.filter(h=>h.st&&!h.st.farm&&!h.amateur&&h.league!=="独立");
  if(rows.length<2) return "";
  const bats=rows.map(h=>h.st.two?h.st:(h.st.type==="b"?h.st:null)).filter(Boolean);
  const pits=rows.map(h=>h.st.two?h.st.pit:(h.st.type==="p"?h.st:null)).filter(Boolean);
  const best=(arr,key,dir,min)=>{
    const c=arr.filter(x=>!min||x[min.k]>=min.v);
    if(!c.length)return null;
    return c.reduce((a,b)=>((dir>0? b[key]>a[key] : b[key]<a[key])?b:a));
  };
  const line=[];
  if(bats.length){
    const hr=best(bats,"hr",1), avg=best(bats,"avg",1,{k:"pa",v:400}), h=best(bats,"h",1), rbi=best(bats,"rbi",1), sb=best(bats,"sb",1);
    if(hr)line.push(`<span>最多本塁打 <b>${hr.hr}本</b></span>`);
    if(avg)line.push(`<span>最高打率 <b>${fmtAvg(avg.avg)}</b></span>`);
    const ops=best(bats,"ops",1,{k:"pa",v:400}); if(ops&&ops.ops!==undefined)line.push(`<span>最高OPS <b>${fmtRate(ops.ops)}</b></span>`);
    if(h)line.push(`<span>最多安打 <b>${h.h}</b></span>`);
    if(rbi)line.push(`<span>最多打点 <b>${rbi.rbi}</b></span>`);
    if(sb)line.push(`<span>最多盗塁 <b>${sb.sb}</b></span>`);
  }
  if(pits.length){
    const w=best(pits,"w",1), era=best(pits,"era",-1,{k:"ip",v:100}), so=best(pits,"so",1), sv=best(pits,"sv",1);
    if(w)line.push(`<span>最多勝利 <b>${w.w}勝</b></span>`);
    if(era)line.push(`<span>最高防御率 <b>${era.era.toFixed(2)}</b></span>`);
    if(so)line.push(`<span>最多奪三振 <b>${so.so}</b></span>`);
    if(sv&&sv.sv)line.push(`<span>最多セーブ <b>${sv.sv}</b></span>`);
  }
  if(p.bestGames)line.push(`<span>連続試合出場 <b>${p.bestGames}</b></span>`);
  if(!line.length) return "";
  return `<div class="card"><h3>自己ベスト</h3><div class="kv">${line.join("")}</div></div>`;
}
function trendCards(p){
  const rows=p.history.filter(h=>!h.amateur);
  if(rows.length<2) return "";
  const years=rows.map(h=>h.year);
  const sal=rows.map(h=>h.league==="MLB"? (h.salary||0)*CONFIG.usdJpy/10000 : (h.salary||0));
  const rate=p.ratingLog&&p.ratingLog.length>1? p.ratingLog.map(x=>x.v):null;
  let h=`<div class="card"><h3>年俸の推移</h3>${sparkline(sal,years,"var(--acc)",v=>v>=10000?`${(v/10000).toFixed(1)}億`:`${Math.round(v)}万`)}</div>`;
  if(rate) h+=`<div class="card"><h3>総合の推移</h3>${sparkline(rate,p.ratingLog.map(x=>x.year),"#6FD08C",v=>Math.round(v))}</div>`;

function radarSVG(p,mode){
  const isP = mode? mode==="p" : p.kind==="投手";
  const labels=isP?["球速","制球","スタミナ","変化球","ノビ","対ピンチ"]:["ミート","パワー","走力","肩力","守備","捕球"];
  const vals=isP?[clamp((p.velo-128)*3.2,0,100),p.pit.control,p.pit.stamina,breakScore(p),p.pit.nobi,p.pit.pinch]
                :[p.bat.meet,p.bat.power,p.bat.speed,p.bat.arm,p.bat.fielding,p.bat.catching];
  const size=230,c=size/2,R=size/2-26,n=labels.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*Math.max(.04,v/100);return [c+r*Math.cos(a),c+r*Math.sin(a)];};
  let g=`<svg class="radar" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">`;
  [.25,.5,.75,1].forEach(k=>{g+=`<polygon points="${labels.map((_,i)=>pt(i,100*k).join(",")).join(" ")}" fill="none" stroke="rgba(255,255,255,.12)"/>`;});
  labels.forEach((_,i)=>{const[x,y]=pt(i,100);g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.09)"/>`;});
  g+=`<polygon points="${vals.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="var(--acc)" fill-opacity=".22" stroke="var(--acc)" stroke-width="2"/>`;
  labels.forEach((lb,i)=>{const[x,y]=pt(i,124);g+=`<text x="${x}" y="${y}" fill="#8FA59B" font-size="11" text-anchor="middle" dominant-baseline="middle">${lb}</text>`;});
  return g+"</svg>";
}

const RANK_CATS=[
  {id:"totalMan",label:"総年俸",fmt:v=>v>=10000?`${(v/10000).toFixed(1)}億`:`${v}万`},
  {id:"peakMan",label:"最高年俸",fmt:v=>v>=10000?`${(v/10000).toFixed(2)}億`:`${v}万`},

  {id:"hr",label:"本塁打",fmt:v=>`${v}本`},
  {id:"rbi",label:"打点",fmt:v=>`${v}`},

  {id:"avg",label:"打率",fmt:v=>fmtAvg(v),min:{k:"ab",v:2000,note:"通算2000打数以上"}},
  {id:"w",label:"勝利",fmt:v=>`${v}勝`},
  {id:"sv",label:"セーブ",fmt:v=>`${v}`},
  {id:"so",label:"奪三振",fmt:v=>`${v}`},
  {id:"era",label:"防御率",fmt:v=>v.toFixed(2),asc:true,min:{k:"ip",v:1000,note:"通算1000投球回以上"}}
];
/* ランキング導入前の記録は、残っている一行表記から数値を復元する */
function legacyStats(x){
  if(x._legacy!==undefined) return x._legacy;
  const t=String(x.line||"");
  const num=(re)=>{const m=t.match(re);return m?Number(m[1]):undefined;};
  const o={};
  o.h=num(/(\d+)安打/); o.hr=num(/安打\s*(\d+)本/);
  const a=t.match(/打率\s*(\.\d{3}|\d\.\d{3})/); if(a) o.avg=Number(a[1].startsWith(".")?"0"+a[1]:a[1]);
  o.w=num(/(\d+)勝/); o.sv=num(/(\d+)S/);
  const e=t.match(/防\s*(\d+\.\d+)/); if(e) o.era=Number(e[1]);
  if(o.h&&o.avg) o.ab=Math.round(o.h/o.avg);                 // 打数は安打と打率から逆算
  if(o.era!==undefined) o.ip=(x.seasons||0)>=8? 1000 : 0;    // 投球回は不明のため在籍8年以上を規定到達とみなす
  Object.keys(o).forEach(k=>o[k]===undefined&&delete o[k]);
  x._legacy = Object.keys(o).length? o : null;
  return x._legacy;
}
function statsOf(x){ return x.stats || legacyStats(x) || {}; }
function rankValue(x,id){
  if(id==="seasons") return x.seasons||0;
  if(id==="titles") return x.titles||0;
  const v=statsOf(x)[id];
  return typeof v==="number"? v : undefined;
}
function rankRows(cat){
  let rows=(S.lives||[]).map((x,i)=>({x,i,v:rankValue(x,cat.id)})).filter(r=>typeof r.v==="number"&&!isNaN(r.v));
  if(cat.min) rows=rows.filter(r=>(statsOf(r.x)[cat.min.k]||0)>=cat.min.v);
  if(!cat.asc) rows=rows.filter(r=>r.v>0);
  rows.sort((a,b)=>cat.asc? a.v-b.v : b.v-a.v);
  return rows;
}

  if(kings.length){

      kings.map(({c,r})=>`<button class="king" aria-pressed="${S.rankCat===c.id}" onclick="S.rankCat='${c.id}';render();setTimeout(()=>{const e=document.getElementById('rankCard');e&&e.scrollIntoView({behavior:'smooth'});},30)">

      `</div><p class="cap" style="margin-top:8px">タップするとその部門の順位表に移る。</p></div>`;

}
function openRanking(){ S.page="rank"; render(); window.scrollTo&&window.scrollTo(0,0); }
function closeRanking(){ S.page=null; render(); window.scrollTo&&window.scrollTo(0,0); }
function rankingCard(limit){
  const L=(S.lives||[]);
  const empty=(msg)=>`<div class="card" id="rankCard"><h3>歴代ランキング</h3><p class="cap">${msg}</p></div>`;
  if(!L.length) return empty("まだ引退した人生がない。1人目が引退すると、総年俸・安打・本塁打・勝利など14部門でここに順位が付く。");
  // 該当者がいる部門だけをタブに出す
  const cats=RANK_CATS.filter(c=>rankRows(c).length>0);
  if(!cats.length) return empty(`記録は${L.length}人分あるが、順位を付けられる成績がまだない。`);
  const cat=cats.find(c=>c.id===S.rankCat)||cats[0];
  const top=rankRows(cat).slice(0,limit||10);
  const legacyN=L.filter(x=>!x.stats).length;
  return `<div class="card" id="rankCard"><h3>歴代ランキング　<span class="cap">${cat.label}</span></h3>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px">
      ${cats.map(c=>`<button class="btn ${c.id===cat.id?"primary":""}" style="padding:6px 10px;font-size:12.5px" onclick="S.rankCat='${c.id}';render()">${c.label}</button>`).join("")}
    </div>
    <table class="lives">`+top.map((r,n)=>{
      const x=r.x;
      return `<tr class="${n===0?"now":""}"><td>${n+1}位</td><td>${esc(x.name)}</td><td style="text-align:right"><b>${cat.fmt(r.v)}</b>　<span class="muted">${esc(x.kind||"")}・${x.seasons||"?"}年</span></td></tr>`;
    }).join("")+`</table>
    ${cat.min?`<p class="cap" style="margin-top:6px">対象：${cat.min.note}</p>`:""}
    ${legacyN?`<p class="cap" style="margin-top:6px">以前に記録された${legacyN}人は、残っている成績から安打・本塁打・打率・勝利・セーブ・防御率だけを復元している。年俸や打点などは対象外。</p>`:""}
  </div>`;
}

/* ============ 保存 ============ */
const SLOTS=[1,2,3];
const SLOTKEY="bblife:slot:v1";
const HOFKEY="bblife:lives:v1";
let SKEY="bblife:save:v1:s1";
/* 保存先：この環境の保存APIがあればそれを使い、無ければブラウザのlocalStorageを使う。
   どちらも無い場合はメモリ上だけの保持になる（自前サーバーやGitHub Pagesでもそのまま動く）。 */
const STORE = (function(){
  if(typeof window!=="undefined" && window.storage) return {
    kind:"app",
    get:(k)=>window.storage.get(k),
    set:(k,v)=>window.storage.set(k,v)
  };
  try{
    if(typeof localStorage!=="undefined"){
      localStorage.setItem("__t","1"); localStorage.removeItem("__t");
      return {kind:"local",
        get:async(k)=>{const v=localStorage.getItem(k);return v?{value:v}:null;},
        set:async(k,v)=>{localStorage.setItem(k,v);return{value:v};}};
    }
  }catch(e){}
  const mem={};
  return {kind:"memory",get:async(k)=>mem[k]?{value:mem[k]}:null,set:async(k,v)=>{mem[k]=v;return{value:v};}};
})();
let saveT=null, storageOK=true;
function save(){
  if(!storageOK)return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      const prev=await STORE.get(SKEY).catch(()=>null);
      if(prev&&prev.value) await STORE.set(SKEY+":bak", prev.value);
      await STORE.set(SKEY, JSON.stringify({p:S.p,seedText:S.seedText,rng:RNG_STATE}));
      S.slotInfo=S.slotInfo||{};
      S.slotInfo[S.slot]= S.p? {name:S.p.name,year:S.p.year,age:S.p.age,
        place: S.p.stage==="hs"?S.p.school:S.p.stage==="ama"?S.p.amaType:
               S.p.league==="MLB"?(S.p.mlbTeam||"MLB"):S.p.league==="独立"?"独立リーグ":
               (S.p.team?teamById(S.p.team).name:"—"),
        retired:!!S.p.retired} : null;
      await STORE.set("bblife:slotinfo:v1", JSON.stringify(S.slotInfo));
    }catch(e){}
  },300);
}
async function loadLives(){
  try{ const r=await STORE.get(HOFKEY); S.lives = r&&r.value? JSON.parse(r.value):[]; }
  catch(e){ S.lives=[]; }
}
async function recordLife(p){
  const e=epilogue(p);
  const t=careerTotals(p,false);
  S.lives=(S.lives||[]).concat([{
    name:p.name, kind:p.kind, from:CONFIG.startYear, to:p.year, seasons:p.seasonsPro,
    age:p.age, titles:p.titles.length, npbHof:e.npbHof, mlbHof:e.mlbHof, meikyukai:e.meikyukai,
    line: (t.b.g>0&&t.q.g>0)? `${t.b.h}安打 ${t.b.hr}本 ／ ${t.q.w}勝 防${t.q.era.toFixed(2)}`
        : p.kind==="投手"? `${t.q.w}勝${t.q.l}敗 ${t.q.sv}S 防${t.q.era.toFixed(2)}`
                        : `${t.b.h}安打 ${t.b.hr}本 打率${fmtAvg(t.b.avg)}`,
    reason:p.retireReason,
    rows:p.history.map(h=>({y:h.year,l:h.label.slice(0,8),s:oneLineStat(h)})),
    stats:(()=>{
      let totalMan=0, peakMan=0;
      p.history.forEach(x=>{ if(!x.salary)return;
        const man = x.league==="MLB"? x.salary*CONFIG.usdJpy/10000 : x.salary;
        totalMan+=man; peakMan=Math.max(peakMan,man); });
      return {
        g:t.b.g, h:t.b.h, hr:t.b.hr, rbi:t.b.rbi, sb:t.b.sb, ab:t.b.ab, avg:t.b.avg,
        pg:t.q.g, w:t.q.w, sv:t.q.sv, hld:t.q.hld, so:t.q.so, ip:t.q.ip, era:t.q.era,
        totalMan:Math.round(totalMan), peakMan:Math.round(peakMan),
        mvp:p.awards.filter(a=>/MVP/.test(a.name)).length,
        awards:p.awards.length
      };
    })(),
    titleList:p.titles.map(t=>`${t.year} ${t.name}`)
  }]).slice(-30);
  try{ await STORE.set(HOFKEY, JSON.stringify(S.lives)); }catch(err){}
}
async function switchSlot(n){
  S.slot=n; SKEY="bblife:save:v1:s"+n;

      if(d.p){ S.p=d.p; S.seedText=d.seedText||""; setSeed(typeof d.rng==="number"? d.rng:(Date.now()>>>0)); } }

async function boot(){
  if(storageOK){
    try{ const sl=await STORE.get(SLOTKEY); if(sl&&sl.value) S.slot=Number(sl.value)||1; }catch(e){ S.slot=1; }
    if(!S.slot)S.slot=1;
    SKEY="bblife:save:v1:s"+S.slot;
    await loadLives();
    try{ const si=await STORE.get("bblife:slotinfo:v1"); S.slotInfo = si&&si.value? JSON.parse(si.value):{}; }catch(e){ S.slotInfo={}; }
    try{
      const r=await STORE.get(SKEY);
      if(r&&r.value){ const d=JSON.parse(r.value);
        if(d.p){ S.p=d.p; S.seedText=d.seedText||"";
          setSeed(typeof d.rng==="number"? d.rng : (Date.now()^(S.p.year*7919))>>>0); } }
    }catch(e){}
  }
  try{ const f=await STORE.get("bblife:fs:v1"); if(f&&f.value){ S.fs=f.value; document.body.className=f.value==="m"?"":"fs-"+f.value; } }catch(e){}
  render();
  if(S.p) toast(`スロット${S.slot}で再開しました`);
}
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{ S.tab=b.dataset.t; S.confirm=null;
    document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-current",x===b));
    render(); window.scrollTo(0,0); };
});
document.getElementById("go").onclick=advance;
/* Webアプリとして配信されている場合だけ Service Worker を登録する（オフライン対応） */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
boot();
</script>
